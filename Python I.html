ontal position and the second for vertical position. If a tuple contains many unrelated values, a reader may have to memorize what each position means. In that case, consider separate variables or a later structure with named fields."],["code","screen_size = (1920, 1080)\nwidth, height = screen_size\nprint(\"Width:\", width)\nprint(\"Height:\", height)"],["out","Width: 1920\nHeight: 1080"],["p","The tuple keeps the dimensions together, while descriptive variable names make their meanings clear when the values are used. In the next lessons, you will use positions to access tuple values and compare when a tuple or list better expresses a collection."],["ul",["A tuple is ordered, so its positions are meaningful.","Commas create tuples; a one-item tuple needs a trailing comma.","Choose tuples for related values whose grouping should stay fixed."]],["h","Practice"],["p","1. Create a tuple named date with a month, day, and year."],["p","2. Write a one-item tuple containing the string \"Python\" and check its type."],["p","3. Create an empty tuple and display its length."]]},"52":{"h":"Lesson 5.2: Modifying and Accessing Tuples","b":[["p","Because tuples are immutable, their items cannot be replaced, added, or removed after the tuple is created. Immutability protects the relationship between each position and its value. It does not mean the values can never be used differently: a program can read them, create a new tuple, or assign a different tuple to the same variable name."],["h","Access an item by its index"],["code","colors = (\"red\", \"green\", \"blue\")\nprint(colors[0])\nprint(colors[2])\nprint(colors[-1])"],["out","red\nblue\nblue"],["p","Indexes start at 0, so index 0 selects the first item and index 2 selects the third. Negative indexes count backward from the end: -1 is the last item, -2 is the item before it. An index must be within the tuple’s valid range; otherwise Python raises IndexError. Use len(tuple_name) when you need to know how many items are present."],["h","Select a range with a slice"],["code","scores = (84, 91, 76, 88, 95)\nprint(scores[1:4])\nprint(scores[:3])\nprint(scores[3:])\nprint(scores[:])"],["out","(91, 76, 88)\n(84, 91, 76)\n(88, 95)\n(84, 91, 76, 88, 95)"],["p","A slice includes the starting index and stops before the ending index. Thus scores[1:4] includes positions 1, 2, and 3. Leaving out the start begins at the first item; leaving out the end continues to the end. A slice creates a new tuple, so it gives you a selected sequence without changing the original."],["h","Tuples cannot be edited in place"],["p","An assignment such as colors[0] = \"purple\" raises TypeError because tuples do not support item assignment. The same principle applies to adding or deleting an item. When the information needs to change, create a new tuple that contains the values you want, then assign it to a variable. This makes the change explicit and leaves any other name referring to the old tuple unchanged."],["code","colors = (\"red\", \"green\", \"blue\")\nupdated_colors = (\"purple\",) + colors[1:]\nprint(colors)\nprint(updated_colors)"],["out","('red', 'green', 'blue')\n('purple', 'green', 'blue')"],["p","The concatenation expression builds a new tuple. It does not edit colors. You could also convert a tuple to a list, change that list, and convert it back, but that extra conversion is usually unnecessary when only a new tuple is needed."],["h","Use tuple methods to inspect values"],["p","Tuples have a small set of methods because they cannot be changed. The count(value) method reports how many times a value occurs, and index(value) returns the position of its first occurrence. If index() cannot find the value, it raises ValueError, so use an in membership check first when the value may be absent."],["code","answers = (\"yes\", \"no\", \"yes\", \"maybe\")\nprint(answers.count(\"yes\"))\nprint(answers.index(\"maybe\"))\nprint(\"later\" in answers)"],["out","2\n3\nFalse"],["ul",["Use square brackets to read an item or slice, not to change a tuple item.","Remember that the end of a slice is excluded.","Create a new tuple when a different set of values is needed."]],["h","Practice"],["p","1. Display the first and last item in a tuple of four animals."],["p","2. Use a slice to create a tuple containing the middle three values."],["p","3. Explain why a tuple assignment to an existing index raises an error."]]},"53":{"h":"Lesson 5.3: Tuples vs. Lists","b":[["p","Tuples and lists both store ordered sequences and support indexes, slices, loops, and membership tests. The key difference is whether the sequence can change. A list is mutable, so its items can be replaced or added and removed. A tuple is immutable, so its item positions and references remain fixed after creation."],["h","Compare the two sequence types"],["p","The table summarizes the most useful differences. Both structures can contain repeated values and mixed types, but a program should choose the one that communicates the intended behavior."],["tbl",[["Feature","Tuple","List"],["Literal syntax","(4, 7) or 4, 7","[4, 7]"],["Can replace an item?","No","Yes"],["Can add or remove items?","No","Yes"]]],["h","Choose the structure that matches the job"],["p","Use a tuple for a fixed group such as a coordinate, RGB color, or a function result with a known set of parts. Use a list for a collection that your program expects to edit, such as a shopping cart, quiz scores being entered, or tasks waiting to be completed. A simple question helps: should this group’s items be added, removed, or replaced during the task? If yes, a list is usually clearer."],["code","point = (12, 5)\nshopping_cart = [\"bread\", \"apples\"]\nshopping_cart.append(\"tea\")\nprint(point)\nprint(shopping_cart)"],["out","(12, 5)\n['bread', 'apples', 'tea']"],["p","The coordinate is a fixed pair, so a tuple communicates that its two positions belong together. The shopping cart can change as items are added, so a list is more appropriate. Both are sequences, but their mutability tells the reader what changes the program intends to allow."],["h","Avoid choosing only by punctuation"],["p","Parentheses and square brackets show different literal types, but the decision is about behavior and meaning. Do not use a tuple merely because a value “looks small,” and do not use a list for every group of data by habit. A tuple is useful when the structure is fixed; a list is useful when the collection itself is expected to change."],["p","There is one subtle point: a tuple cannot have its own items replaced, but it can contain a mutable object such as a list. That inner list can still change. The tuple protects its references and positions, not every object reachable through it. Beginners should usually keep tuple contents simple until they are comfortable tracing nested collections."],["code","record = (\"Maya\", [88, 91])\nrecord[1].append(95)\nprint(record)"],["out","('Maya', [88, 91, 95])"],["p","The list inside record changes, but the tuple still has the same two positions and still refers to the same name and list. This behavior does not make tuples fully immutable containers of all nested data; it means the tuple’s direct items cannot be reassigned."],["h","Return multiple values together"],["p","Functions often return a tuple when they produce several related results. A caller can keep the result as one tuple or unpack its values into separate names. This is a convenient way to communicate a fixed set of outputs, such as a width and height or a quotient and remainder."],["code","dimensions = (640, 480)\nwidth, height = dimensions\nprint(width * height)"],["out","307200"],["ul",["Choose a tuple when a sequence’s size and positions should remain fixed.","Choose a list when the program needs to change the collection.","Remember that a tuple may contain a mutable value, such as a list."]],["h","Practice"],["p","1. Choose a tuple or list for a fixed screen coordinate and explain why."],["p","2. Choose a tuple or list for names added by a user as the program runs."],["p","3. Describe what can change in the record tuple example and what cannot."]]},"54":{"h":"Lesson 5.4: Conditionals in Tuples","b":[["p","Conditionals can test whether a tuple contains a value, compare items, or make decisions using the tuple’s length. The tuple itself stays unchanged while a program decides what to do. These checks are useful for validating a choice, finding a permitted option, or interpreting a fixed record."],["h","Check for a value with in"],["code","valid_sizes = (\"small\", \"medium\", \"large\")\nsize = \"medium\"\nif size in valid_sizes:\n    print(\"Size accepted\")\nelse:\n    print(\"Choose a listed size\")"],["out","Size accepted"],["p","The in operator searches the tuple for an equal item and returns True or False. Use not in when the condition should be true only if the value is absent. Membership is case-sensitive for strings, so \"Medium\" and \"medium\" are different values. A membership test does not modify the tuple."],["h","Compare values and positions"],["p","A conditional can compare a tuple item with another value, such as checking whether a recorded score meets a threshold. It can also compare complete tuples. Python compares tuple items from left to right: it checks the first pair, then moves to the next pair only when the earlier pair is equal. This makes tuple comparisons useful for consistent records, but it is important to understand which position is being compared first."],["code","result = (\"pass\", 82)\nif result[0] == \"pass\" and result[1] >= 70:\n    print(\"Credit earned\")\nelse:\n    print(\"Review the result\")"],["out","Credit earned"],["p","This condition checks the status and the score. Because both tests must be true, and joins them. If one part fails, Python selects the else branch. Give each position a clear meaning and consider unpacking the tuple into descriptive variable names when a condition becomes difficult to read."],["h","Use length checks before unpacking uncertain data"],["p","Unpacking expects the number of variables to match the number of tuple items. If a tuple may contain a different number of items, check its length before unpacking. This prevents a ValueError and lets the program respond with a helpful message."],["code","measurement = (12, 5)\nif len(measurement) == 2:\n    width, height = measurement\n    print(\"Area:\", width * height)\nelse:\n    print(\"A measurement needs two values\")"],["out","Area: 60"],["p","The length condition establishes that two values are available before Python assigns them to width and height. This is especially helpful when data comes from an input source or another part of a program whose output shape may vary. For a tuple you create yourself and know to have two values, direct unpacking is simpler."],["h","Keep conditions readable"],["p","Use membership checks for questions about whether a value appears, indexes for a specific position, and length checks for the number of items. These checks answer different questions. Avoid combining many tuple positions and operators into one long condition; assigning items to descriptive variables can make the rule easier to explain and maintain."],["ul",["Use in and not in to check for tuple membership.","Use and when every required condition must be true.","Check a tuple’s length before unpacking when its size may vary."]],["h","Practice"],["p","1. Check whether \"urgent\" appears in a tuple of priority labels."],["p","2. Print a message when the second item in a tuple is greater than 10."],["p","3. Write a length check that unpacks a two-item coordinate safely."]]},"55":{"h":"Lesson 5.5: Loops in Tuples","b":[["p","A for loop visits tuple items in order, one item per pass. This makes tuples convenient for displaying fixed values, checking every option, or calculating a result from the items. A loop reads the tuple; it does not change the tuple’s contents."],["h","Visit every item"],["code","days = (\"Monday\", \"Tuesday\", \"Wednesday\")\nfor day in days:\n    print(day)"],["out","Monday\nTuesday\nWednesday"],["p","On each pass, the loop variable day refers to the next item. The loop ends automatically after the last item. A for loop is a natural choice when you want to process every item once, because the tuple already determines how many items the loop will visit."],["h","Unpack each nested tuple in a loop"],["p","A tuple can contain other tuples, such as pairs that represent names and scores. When each inner tuple has a known number of items, the loop can unpack it directly into descriptive variables. This avoids repeatedly using numeric indexes and makes the code easier to read."],["code","scores = ((\"Maya\", 88), (\"Luis\", 72), (\"Ari\", 95))\nfor name, score in scores:\n    print(name, \"scored\", score)"],["out","Maya scored 88\nLuis scored 72\nAri scored 95"],["p","The outer tuple contains three records. Each record is a two-item tuple, so name and score receive the corresponding values during each pass. The number of loop variables must match the number of values in each inner tuple; otherwise Python raises ValueError during unpacking."],["h","Build a total while looping"],["p","A running total is a variable that starts with an initial value and updates once during each loop pass. To total numeric tuple values, begin at 0 and add each item. A counter can use the same pattern when you want to count items that satisfy a condition."],["code","scores = (88, 72, 95)\ntotal = 0\nfor score in scores:\n    total = total + score\nprint(\"Total:\", total)"],["out","Total: 255"],["p","The total variable is created before the loop so it can keep its value between passes. Each score is added to the total, and the final print runs after the loop completes. If the tuple might be empty, the total remains 0. To calculate an average, also check that the tuple has at least one item before dividing by len(scores)."],["h","Use a loop when each item needs the same action"],["p","A loop avoids writing a separate print or calculation for every position. If you later add another item to the tuple, the same loop handles it without needing another block of repeated code. Use a direct loop when only the values matter. If a task also needs each position number, the enumerate() function can provide an index and value together."],["code","colors = (\"red\", \"green\", \"blue\")\nfor position, color in enumerate(colors):\n    print(position, color)"],["out","0 red\n1 green\n2 blue"],["p","enumerate() pairs each position with its item, starting at 0 by default. The tuple remains unchanged; the loop simply receives useful information about each pass. Use this when a position is part of the output or decision, and use a plain for item in tuple loop when it is not needed."],["h","Loop through a tuple of pairs"],["p","When a tuple contains pairs, unpacking each pair in the loop is clearer than using pair[0] and pair[1]. Names such as product and quantity explain the data’s role. This pattern is common when a small fixed set of records is built directly into a program."],["ul",["A for loop visits tuple items in order and stops at the end.","Unpack nested tuples only when their item counts are consistent.","Keep totals and counters outside the loop, then update them inside it."]],["h","Practice"],["p","1. Loop through a tuple of three temperatures and print each one."],["p","2. Use a loop to calculate the total of a tuple of four prices."],["p","3. Loop through a tuple of name–score pairs and print only scores of 80 or higher."]]},"59":{"h":"Chapter 5 Review","b":[["p","A tuple is an ordered sequence whose direct items cannot be replaced, added, or removed. Commas create the tuple, including the required comma in a one-item tuple. Indexes and slices read items; slices create new tuples. When values must change, build a new tuple or choose a list. Use tuples for fixed related values and lists for collections that need editing. Membership checks, comparisons, conditionals, unpacking, and loops all help a program work with tuple contents without changing them."],["h","Choose the right sequence"],["tbl",[["Question","Tuple","List"],["Can an item be reassigned?","No","Yes"],["Can items be added or removed?","No","Yes"],["Best fit","Fixed related values","Changing collection"]]],["h","Apply tuples to a small report"],["p","This example stores three fixed name–score records as nested tuples. The loop unpacks each pair, checks a score, and adds every score to a running total. It combines the tuple skills from this chapter without modifying the original records."],["code","results = ((\"Maya\", 88), (\"Luis\", 72), (\"Ari\", 95))\ntotal = 0\nfor name, score in results:\n    total = total + score\n    if score >= 80:\n        print(name, \"earned a strong score\")\nprint(\"Class total:\", total)"],["out","Maya earned a strong score\nAri earned a strong score\nClass total: 255"],["p","Each inner tuple holds one student and one score. The loop reads those two values into name and score, then the conditional decides whether to print a message. The total is updated for every record. Because the tuples are fixed, the loop can inspect all of them without changing their stored values."]]},"60":{"h":"Chapter 6: Dictionaries","b":[["p","A dictionary stores information as key–value pairs. A key gives a value a name, so a program can look up a student’s grade by \"student_id\" or an item’s quantity by \"quantity\" instead of remembering a numbered position. This chapter builds from small dictionaries to safe lookups, updates, decisions, loops, and nested records."],["h","Learning goals"],["ul",["Create dictionaries and explain how keys connect to values.","Look up information safely and handle keys that may be missing.","Add, update, and remove entries with assignment and common methods.","Use dictionary methods, membership checks, conditionals, and loops.","Organize related records with nested dictionaries."]],["h","Key terms"],["tbl",[["Term","Meaning"],["Dictionary","An ordered, changeable collection of key–value pairs."],["Key","A unique, hashable label used to identify an entry."],["Value","The information associated with a key."],["Entry","One key together with its associated value."],["Lookup","Retrieving a value by supplying its key."]]]]},"61":{"h":"Lesson 6.1: Introduction to Dictionaries","b":[["p","A dictionary is a collection that connects each key to a value. Write a dictionary with curly braces, place a colon between each key and its value, and separate entries with commas. Keys act like labels. Unlike list indexes, they let a program retrieve information by meaning."],["h","Create a dictionary"],["code","student = {\"name\": \"Maya\", \"grade\": 8, \"is_enrolled\": True}\nprint(student)\nprint(type(student))"],["out","{'name': 'Maya', 'grade': 8, 'is_enrolled': True}\n<class 'dict'>"],["p","The dictionary has three entries. The key \"name\" is paired with the string \"Maya\"; \"grade\" is paired with the integer 8; and \"is_enrolled\" is paired with the Boolean value True. The keys are strings, while the values can have different types. A dictionary is useful when each piece of information has a descriptive label, as in a profile, product record, or settings collection."],["h","Think of a dictionary as a labeled record"],["p","A useful way to picture a dictionary is as a set of labeled drawers. The key is the label on a drawer, and the value is what the drawer contains. A program that asks for student[\"grade\"] is naming the information it wants; it does not need to count how many facts came before the grade. This makes code easier to read when the stored facts have different meanings."],["p","Each key must be unique within one dictionary, because Python needs one clear destination for a lookup. Values do not have to be unique: two keys can point to the same value. Keys are commonly strings, but Python also allows immutable, hashable types such as integers and tuples of immutable values. Lists and dictionaries cannot be keys because their contents can change."],["code","room_numbers = {\"Maya\": 12, \"Luis\": 12, \"Ari\": 15}\nprint(room_numbers[\"Maya\"])\nprint(room_numbers[\"Luis\"])"],["out","12\n12"],["p","Here, two different names map to the same room number. That is valid because uniqueness applies to the keys, not to the values. If the goal were to store several names for one room, a different structure, such as a dictionary whose values are lists, could represent that relationship."],["h","Compare a dictionary with a list"],["p","A list is organized by position: scores[0] means the first score, and scores[1] means the second. A dictionary is organized by keys: student[\"grade\"] means the value associated with the grade key. This makes dictionaries suitable for records with named fields. Lists remain a good choice when the main idea is a sequence of similar items, such as all the scores from a quiz."],["code","scores = [88, 91, 76]\nstudent = {\"name\": \"Maya\", \"grade\": 8}\nprint(scores[1])\nprint(student[\"grade\"])"],["out","91\n8"],["p","The expressions both retrieve values, but they use different kinds of identifiers. The list uses the integer position 1; the dictionary uses the key \"grade\". Dictionary keys are unique. If the same key appears more than once in a dictionary literal, the later value replaces the earlier one, so a dictionary cannot keep two separate entries under the same key."],["h","Choose clear keys and values"],["p","Keys should communicate what a value means. Names such as \"email\", \"quantity\", and \"is_active\" are more useful than vague labels such as \"x\" or \"thing\". In beginner programs, strings are the most common keys. Integers and other immutable, hashable values can also be keys; mutable values such as lists cannot. Values may be strings, numbers, Booleans, lists, or even another dictionary."],["code","product = {\"name\": \"Notebook\", \"price\": 2.5, \"colors\": [\"blue\", \"green\"]}\nprint(product)"],["out","{'name': 'Notebook', 'price': 2.5, 'colors': ['blue', 'green']}"],["p","An empty dictionary is written as {}. This gives a program a place to add entries later. In Python, the empty braces create a dictionary; use set() when you specifically need an empty set. A nonempty set uses braces too, but its syntax and purpose differ from a dictionary."],["code","settings = {}\nprint(settings)\nprint(len(settings))"],["out","{}\n0"],["p","Dictionaries preserve the order in which entries are inserted in modern Python, but they are not accessed by numeric position. The purpose of an order-preserving dictionary is still key-based lookup. If a program needs a specific sequence, use a list; if it needs named facts that can be found directly, use a dictionary."],["h","Common mistakes"],["ul",["Using square brackets around a dictionary literal instead of curly braces.","Forgetting the colon between a key and its value or a comma between entries.","Expecting a dictionary to allow the same key to hold two separate entries."]],["h","Practice"],["p","1. Create a dictionary named book with the keys \"title\", \"pages\", and \"finished\" and appropriate values."],["p","2. Create an empty dictionary for storing a person’s contact details."],["p","3. Explain when a list is a better fit than a dictionary."]]},"62":{"h":"Lesson 6.2: Accessing Values by Key","b":[["p","To retrieve a value, write the dictionary name followed by the requested key in square brackets. The key must match an existing key exactly, including its capitalization and data type. Dictionary lookups do not search by entry position; they use the key to find the associated value."],["h","Use square brackets when the key should exist"],["code","student = {\"name\": \"Maya\", \"grade\": 8, \"is_enrolled\": True}\nprint(student[\"name\"])\nprint(student[\"grade\"])"],["out","Maya\n8"],["p","The key is written as a string, so quotation marks are required in this example. Writing student[name] would ask Python to use the value associated with a variable named name, which is a different expression. A bracket lookup is clear when the key is known to exist and a missing entry should be treated as a programming error."],["h","A missing key causes an error"],["p","If a key is absent, dictionary[key] raises a KeyError. This is different from a list IndexError: a KeyError means the requested label was not found. Check spelling, capitalization, and whether the entry was created before using the lookup. For optional information, choose a safe lookup so the program can keep running when the key is missing."],["code","student = {\"name\": \"Maya\", \"grade\": 8}\nprint(student[\"email\"])"],["p","This example raises KeyError because student has no \"email\" entry. An error can be useful when the program requires the information, but it is not always the best response when a field is optional."],["h","Use get() when a key may be missing"],["p","The get() method returns the value for a key when it exists. If the key is missing, get() returns None by default, or a fallback value that you provide as the second argument. A fallback is helpful when the program can use a reasonable substitute, such as an empty string or a label like \"not provided\"."],["code","student = {\"name\": \"Maya\", \"grade\": 8}\nprint(student.get(\"name\"))\nprint(student.get(\"email\"))\nprint(student.get(\"email\", \"not provided\"))"],["out","Maya\nNone\nnot provided"],["p","Calling get() does not add a missing key to the dictionary. It only returns a value for the current expression. That distinction lets you display a fallback without changing the stored record. If the program needs to add the fallback permanently, assign it explicitly in a later statement."],["h","Choose a lookup based on what the program expects"],["p","Use square brackets when the key is required for the next step. If the key is missing, the KeyError points to a broken assumption and helps reveal the problem. Use get() when the field is optional and the program has a sensible way to continue. A default should fit the type and meaning of the expected value: 0 for a count, an empty list for a collection, or a clear message for optional display text."],["code","settings = {\"volume\": 5}\nvolume = settings.get(\"volume\", 0)\nsubtitle = settings.get(\"subtitle\", \"No subtitle\")\nprint(volume)\nprint(subtitle)"],["out","5\nNo subtitle"],["p","The default is returned only for this lookup. It does not change settings, so \"subtitle\" remains absent. If you want future code to treat the default as saved data, use an assignment such as settings[\"subtitle\"] = \"No subtitle\". Keep the difference between a temporary fallback and a new stored entry clear."],["h","Distinguish missing values from stored values"],["p","A dictionary can contain a key whose value is None. In that case, get(key) returns None whether the key is missing or explicitly paired with None. Use key in dictionary when the difference matters: the membership test tells you whether the entry exists, regardless of its value."],["code","profile = {\"name\": \"Maya\", \"nickname\": None}\nprint(\"nickname\" in profile)\nprint(\"email\" in profile)\nprint(profile.get(\"nickname\"))"],["out","True\nFalse\nNone"],["p","The first check is True because \"nickname\" is a key even though its value is None. The second is False because \"email\" is absent. This pattern is useful when None is a meaningful stored value and should not be confused with missing information."],["h","Read nested information one key at a time"],["p","A value can itself be a dictionary. To access an inner value, use one lookup for each level: records[\"student\"][\"grade\"]. The first key retrieves the inner dictionary; the second key retrieves a value from that dictionary. If either key may be missing, check each level before continuing, or use get() carefully so the program does not attempt to look up a key on None."],["h","Common mistakes"],["ul",["Using a key that is spelled differently from the key stored in the dictionary.","Assuming get() inserts a missing key; it only returns a fallback value.","Treating a missing key and a key whose value is None as the same situation."]],["h","Practice"],["p","1. Use bracket notation to display the \"title\" value from a book dictionary."],["p","2. Use get() to display \"not listed\" when a dictionary has no \"publisher\" key."],["p","3. Write a membership check that tells whether \"email\" is a key in a contact dictionary."]]},"63":{"h":"Lesson 6.3: Adding, Updating, and Removing Entries","b":[["p","Dictionaries are mutable, so a program can add, replace, and remove entries after creating the dictionary. Use an assignment with a key in square brackets. If the key is new, Python creates an entry; if the key already exists, Python replaces its value. A dictionary keeps one value for each key."],["h","Add an entry or update an existing one"],["code","inventory = {\"pens\": 12, \"notebooks\": 5}\ninventory[\"folders\"] = 4\ninventory[\"pens\"] = 10\nprint(inventory)"],["out","{'pens': 10, 'notebooks': 5, 'folders': 4}"],["p","The first assignment adds \"folders\" because that key was new. The second assignment updates the existing \"pens\" entry. It does not create a second pens entry. When a program changes a value, the existing key remains in its insertion position; a newly added key appears as a new entry."],["h","Update several entries together"],["p","The update() method accepts another dictionary or a sequence of key–value pairs. It adds any new keys and replaces the values for keys that already exist. This is useful when a set of related changes arrives together, such as revised product counts or settings. Like other mutating methods, update() changes the original dictionary and returns None."],["code","inventory = {\"pens\": 12, \"notebooks\": 5}\ninventory.update({\"notebooks\": 6, \"markers\": 3})\nprint(inventory)"],["out","{'pens': 12, 'notebooks': 6, 'markers': 3}"],["p","The notebooks count is replaced with 6, and a new markers entry is added. To keep an original dictionary unchanged, first make a copy with inventory.copy(), then apply updates to the copy. That is a shallow copy, so nested mutable values inside the dictionary are still shared."],["h","Understand that updates change the existing object"],["p","A dictionary is mutable: a statement can change its contents while the dictionary object remains the same object. If two variables refer to that same dictionary, either name observes the update. This is useful when several parts of a program intentionally share data, but it can surprise a beginner who expects assignment through one name to make a private copy."],["code","first_name = {\"color\": \"blue\"}\nsecond_name = first_name\nsecond_name[\"color\"] = \"green\"\nprint(first_name)\nprint(second_name)"],["out","{'color': 'green'}\n{'color': 'green'}"],["p","Both names refer to the same dictionary, so the change appears through both. A shallow copy with .copy() creates a separate outer dictionary. If that dictionary contains a nested list or dictionary, however, the inner object is still shared; making fully independent nested data requires a deeper copy or constructing new inner values deliberately."],["h","Remove entries by key"],["p","Use pop(key) to remove an entry and receive its value. Use del dictionary[key] when you only need to delete it. Both operations require that the key exist; pop() can take a default value to avoid an error when an optional key is missing. clear() removes every entry and leaves an empty dictionary."],["code","inventory = {\"pens\": 12, \"notebooks\": 5, \"folders\": 4}\nremoved = inventory.pop(\"folders\")\ndel inventory[\"pens\"]\nprint(\"Removed:\", removed)\nprint(inventory)"],["out","Removed: 4\n{'notebooks': 5}"],["p","The value returned by pop() is saved in removed before the entry disappears. The del statement removes \"pens\" without returning its value. If the program might request a missing key, use a condition such as if key in inventory before removing it, or supply a default to pop()."],["h","Choose the removal operation deliberately"],["code","settings = {\"theme\": \"light\", \"sound\": True}\nold_theme = settings.pop(\"theme\", \"default\")\nprint(old_theme)\nprint(settings)\nsettings.clear()\nprint(settings)"],["out","light\n{'sound': True}\n{}"],["p","The second argument to pop() is returned only when the key is absent; it does not get inserted into the dictionary. After the call, settings has one fewer entry. clear() then empties the same dictionary object, so any other name referring to that object will also see it become empty."],["h","Keep related changes readable"],["p","When a dictionary update contains several steps, separate them into clear statements and display the result while learning. This makes it easier to identify which assignment added an entry and which one replaced a value. A descriptive dictionary name and descriptive keys also help a reader understand why each update occurs."],["h","Common mistakes"],["ul",["Expecting an assignment to an existing key to create a duplicate entry.","Writing dictionary.update(...) = value; update() is a method call, not an assignment target.","Removing a key without considering that it might not exist."]],["h","Practice"],["p","1. Add a \"category\" entry to a product dictionary, then update its \"price\" entry."],["p","2. Use update() to add two settings to a dictionary at once."],["p","3. Remove an optional key safely and display the value that was removed."]]},"64":{"h":"Lesson 6.4: Dictionary Methods and Membership","b":[["p","Dictionary methods provide useful ways to inspect its keys, values, and entries. A key–value pair is one entry. The keys() method provides the keys, values() provides the stored values, and items() provides pairs that can be unpacked into a key and value. These methods are especially useful when a program needs to examine rather than change a dictionary."],["h","View keys, values, and entries"],["code","book = {\"title\": \"River Paths\", \"author\": \"A. Ruiz\", \"pages\": 280}\nprint(list(book.keys()))\nprint(list(book.values()))\nprint(list(book.items()))"],["out","['title', 'author', 'pages']\n['River Paths', 'A. Ruiz', 280]\n[('title', 'River Paths'), ('author', 'A. Ruiz'), ('pages', 280)]"],["p","The methods return dictionary views, which are iterable objects that reflect the dictionary’s current contents. Wrapping a view in list() makes a separate list snapshot that is convenient to display or index. The view itself is not a new dictionary and does not copy all the data. If the dictionary changes later, an existing view reflects those changes."],["h","Membership checks keys by default"],["p","The in and not in operators check dictionary keys. This behavior is useful because keys are the labels used for lookups. A membership test does not check whether a value appears in the dictionary. To test values, ask whether the value is in dictionary.values()."],["code","book = {\"title\": \"River Paths\", \"author\": \"A. Ruiz\", \"pages\": 280}\nprint(\"author\" in book)\nprint(\"A. Ruiz\" in book)\nprint(\"A. Ruiz\" in book.values())"],["out","True\nFalse\nTrue"],["p","The first expression is True because \"author\" is a key. The second is False because \"A. Ruiz\" is a value, not a key. The third explicitly checks the values view, so it returns True. Membership on strings is case-sensitive, so \"Author\" and \"author\" are different keys."],["h","Read each method as a question about the data"],["p","The methods are easiest to choose when you first state the question in plain language. “Which labels are stored?” points to keys(); “What information is stored?” points to values(); “Which label is paired with each piece of information?” points to items(). The in operator asks whether a key exists unless you explicitly give it a values() view. This distinction matters because a value that happens to look like a key is still not a key."],["code","inventory = {\"pens\": 12, \"folders\": 4}\nprint(\"pens\" in inventory)\nprint(12 in inventory)\nprint(12 in inventory.values())"],["out","True\nFalse\nTrue"],["p","A dictionary view can be used directly in a for loop, so converting it to a list is not needed just to visit its contents. Convert to list when you specifically need a list snapshot, such as to display the full result or use numeric indexing. Use the original dictionary for lookups and updates."],["h","Compare dictionaries by their contents"],["p","The equality operator == checks whether two dictionaries have equal key–value pairs. The insertion order does not affect dictionary equality: two dictionaries with the same keys and corresponding values compare equal even if the entries were written in a different order. This differs from lists, where the order of the elements is part of the comparison."],["code","first = {\"name\": \"Maya\", \"grade\": 8}\nsecond = {\"grade\": 8, \"name\": \"Maya\"}\nprint(first == second)\nprint(list(first) == list(second))"],["out","True\nFalse"],["p","The dictionaries compare equal because each key maps to the same value. The lists of keys compare unequal because their key order differs. Choose == when you care about the complete mapping, and inspect keys() or items() when order itself matters to the task."],["h","Use the right method for the question"],["p","If you need labels, use keys(); if you need the data alone, use values(); if you need both together, use items(). If the goal is simply to check whether a particular key exists, use key in dictionary rather than converting all keys to a list first. These direct expressions are concise and communicate the question clearly."],["h","Common mistakes"],["ul",["Assuming value in dictionary searches the values; it searches keys.","Expecting keys(), values(), or items() to return a regular list rather than a view.","Comparing two dictionaries as if entry order determined equality."]],["h","Practice"],["p","1. Display the list of keys and the list of values from a small dictionary."],["p","2. Check whether \"quantity\" is a key in a product dictionary."],["p","3. Check whether the number 0 appears among a dictionary’s values."]]},"65":{"h":"Lesson 6.5: Conditionals with Dictionaries","b":[["p","Conditionals let a program respond to dictionary contents. A membership test can check that a key exists before a bracket lookup. A comparison can then test the retrieved value. This separates two questions: whether the information is present and whether that information meets a rule."],["h","Check for a key before using its value"],["code","product = {\"name\": \"Notebook\", \"quantity\": 6}\nrequested_key = \"quantity\"\nif requested_key in product:\n    print(\"Value:\", product[requested_key])\nelse:\n    print(\"That detail is not available\")"],["out","Value: 6"],["p","Python evaluates the membership condition first. Because \"quantity\" is a key, the indented block runs and the bracket lookup is safe. If the requested key were \"color\", the condition would be False and Python would run the alternative block without trying to retrieve the missing value."],["h","Make decisions based on a value"],["p","After confirming a key exists, a program can compare its value with a number or text. This pattern is common in inventory, settings, and account records. Keep the key check and value comparison logically connected so the code cannot attempt a lookup that has not been validated."],["code","product = {\"name\": \"Notebook\", \"quantity\": 6}\nif \"quantity\" in product and product[\"quantity\"] > 0:\n    print(\"Available\")\nelse:\n    print(\"Unavailable or quantity not recorded\")"],["out","Available"],["p","The and operator short-circuits: Python evaluates the right side only when the left side is True. If \"quantity\" is absent, the bracket lookup is skipped, so no KeyError occurs. If the key exists, Python compares its value with zero and selects the appropriate branch."],["h","Separate presence checks from rule checks"],["p","A dictionary condition often has two parts: first establish that the needed key exists, then decide whether the value satisfies a rule. Those parts answer different questions. A key can exist while its value is zero, False, or an empty string; those values may mean something different from a missing key. Test membership when existence matters, then compare the value using the rule the program actually needs."],["code","account = {\"active\": False, \"attempts\": 0}\nif \"active\" in account:\n    if account[\"active\"]:\n        print(\"Account is active\")\n    else:\n        print(\"Account is inactive\")\nelse:\n    print(\"Account status is not recorded\")"],["out","Account is inactive"],["p","This nested condition distinguishes a recorded False from an absent \"active\" key. That distinction helps a program report accurate states instead of treating every false-looking or empty value as missing. When the rules grow, intermediate variables and nested conditions can make the order of checks easier to inspect."],["h","Use defaults for optional information"],["p","When a missing key should lead to a standard value, get() can provide a default inside a condition or calculation. This is useful for optional settings such as a discount, preferred theme, or shipping method. Choose a default that makes sense for the program, and remember that get() does not add that default to the dictionary."],["code","order = {\"subtotal\": 32.0}\ndiscount = order.get(\"discount\", 0)\nif discount > 0:\n    print(\"Discount applied\")\nelse:\n    print(\"No discount\")\nprint(\"Discount value:\", discount)"],["out","No discount\nDiscount value: 0"],["p","The order has no \"discount\" key, so get() returns 0 for this calculation. The dictionary itself remains unchanged. If missing and zero have different meanings, check membership instead of relying on a numeric default."],["h","Build a conditional from clear steps"],["p","A reliable sequence is: test whether the key exists, retrieve the value, then compare or use it. For short conditions, and can combine a safe membership check with a lookup. For longer logic, separate the steps into nested if statements or assign an intermediate result to a clearly named variable. Read the indentation to see which instructions depend on each earlier check."],["h","Common mistakes"],["ul",["Using a bracket lookup in a condition before confirming that an optional key exists.","Checking whether a value is present when the actual question is whether its key exists.","Assuming a default from get() becomes a saved dictionary entry."]],["h","Practice"],["p","1. Print a message when \"email\" exists in a contact dictionary."],["p","2. Check that an inventory key exists and its quantity is greater than zero before reporting availability."],["p","3. Use get() to treat a missing \"attempts\" entry as 0, then report whether the count exceeds 3."]]},"66":{"h":"Lesson 6.6: Loops with Dictionaries","b":[["p","A loop can visit each part of a dictionary so a program can display, count, or calculate from its entries. A for loop over a dictionary visits its keys by default. Use values() when the task needs only the stored values, and use items() when it needs both the key and its value."],["h","Loop through keys"],["code","prices = {\"pen\": 0.75, \"notebook\": 2.5, \"folder\": 1.25}\nfor item in prices:\n    print(item)"],["out","pen\nnotebook\nfolder"],["p","The loop variable item receives one key on each pass. Because dictionary keys preserve insertion order in modern Python, the example visits them in the order they were added. The loop does not automatically provide the value; use prices[item] inside the loop when a key and its value are both needed."],["h","Loop through values or key–value pairs"],["code","prices = {\"pen\": 0.75, \"notebook\": 2.5, \"folder\": 1.25}\nfor price in prices.values():\n    print(\"Price:\", price)\n\nfor item, price in prices.items():\n    print(item, \"costs\", price)"],["out","Price: 0.75\nPrice: 2.5\nPrice: 1.25\npen costs 0.75\nnotebook costs 2.5\nfolder costs 1.25"],["p","The first loop receives only values. The second uses items(), which yields pairs; Python unpacks each pair into item and price. Choose the loop variable names to describe what they represent. Avoid using a vague name such as x when item and price make the purpose obvious."],["h","Select the loop form that matches the task"],["p","A direct loop such as for key in data visits one key at a time. Inside that loop, data[key] can retrieve the paired value. A loop over data.values() gives each value directly, which is convenient when the key is irrelevant. A loop over data.items() gives both parts together and avoids a second lookup. These are three views of the same mapping, so choose the one that makes the work clearest."],["code","temperatures = {\"Monday\": 18, \"Tuesday\": 21, \"Wednesday\": 16}\nfor day, temperature in temperatures.items():\n    print(day, \"was\", temperature, \"degrees\")"],["out","Monday was 18 degrees\nTuesday was 21 degrees\nWednesday was 16 degrees"],["p","The loop processes one key–value pair during each pass. Dictionary insertion order is preserved in modern Python, so these entries are visited in the order they were added. If a task needs a different order, sort the keys explicitly; do not assume the dictionary will arrange them alphabetically or numerically on its own."],["h","Calculate a total or count"],["p","A running total begins at zero before the loop and changes once for every value included in the calculation. A counter follows the same pattern, but it increases by one when an entry meets a condition. Keep the update inside the loop so each relevant entry contributes exactly once."],["code","scores = {\"Maya\": 88, \"Luis\": 72, \"Ari\": 95}\ntotal = 0\npassing = 0\nfor name, score in scores.items():\n    total = total + score\n    if score >= 70:\n        passing = passing + 1\nprint(\"Total:\", total)\nprint(\"Passing:\", passing)"],["out","Total: 255\nPassing: 3"],["p","The loop visits each name–score pair. Every score contributes to total, while passing increases only when score is at least 70. If the dictionary might be empty, check that it contains entries before dividing by its length to calculate an average."],["h","Do not change the dictionary’s size during a loop"],["p","Adding or removing keys while directly looping over a dictionary can raise a RuntimeError or make the traversal difficult to reason about. If entries need to be removed based on a rule, first collect the keys to remove, then delete them after the loop; or build a new dictionary that keeps the desired entries. Updating the value for an existing key is different from changing the number of keys, but keeping the loop focused on reading is usually clearest for beginners."],["code","stock = {\"pens\": 0, \"books\": 4, \"folders\": 0}\nempty_items = []\nfor item, quantity in stock.items():\n    if quantity == 0:\n        empty_items.append(item)\nfor item in empty_items:\n    del stock[item]\nprint(stock)"],["out","{'books': 4}"],["p","The first loop records keys but does not change stock. The second loop removes the selected entries after the original traversal has finished. This two-step approach prevents the dictionary from changing size while Python is iterating over it."],["h","Common mistakes"],["ul",["Expecting a direct for loop over a dictionary to produce its values automatically.","Forgetting to unpack key–value pairs when using items().","Adding or deleting keys while iterating directly over the same dictionary."]],["h","Practice"],["p","1. Loop through a dictionary of three colors and print each key."],["p","2. Use items() to print each product and its quantity."],["p","3. Count how many dictionary values are at least 10."]]},"67":{"h":"Lesson 6.7: Nested Dictionaries","b":[["p","A dictionary value can be another dictionary. This creates a nested dictionary, which is useful for grouping related records. An outer key can identify a person or product, while the inner dictionary stores details about that record. The structure is still built from key–value pairs, but an access expression follows more than one key."],["h","Create a dictionary of records"],["code","students = {\n    \"S104\": {\"name\": \"Ari\", \"score\": 91},\n    \"S205\": {\"name\": \"Maya\", \"score\": 86}\n}\nprint(students)"],["out","{'S104': {'name': 'Ari', 'score': 91}, 'S205': {'name': 'Maya', 'score': 86}}"],["p","The outer dictionary uses student IDs as keys. Each value is an inner dictionary containing a name and a score. This organization is helpful when a program needs to find one record quickly by its ID and then retrieve several related details from that record."],["h","Access one nested value at a time"],["code","students = {\n    \"S104\": {\"name\": \"Ari\", \"score\": 91},\n    \"S205\": {\"name\": \"Maya\", \"score\": 86}\n}\nprint(students[\"S104\"])\nprint(students[\"S104\"][\"name\"])\nprint(students[\"S205\"][\"score\"])"],["out","{'name': 'Ari', 'score': 91}\nAri\n86"],["p","The first lookup returns the inner dictionary for S104. The second lookup continues from that inner dictionary and returns the name value. Read a nested expression from left to right: each pair of brackets selects the next level. If any key in the path is missing, the lookup raises KeyError."],["h","Trace a nested lookup as a path"],["p","For students[\"S104\"][\"name\"], Python first looks up \"S104\" in the outer dictionary. The result is an inner dictionary. Python then looks up \"name\" inside that result. Thinking of the expression as a path helps you find exactly where a missing-key error occurs: the outer record may be missing, or the inner field may be missing."],["p","Nested dictionaries are helpful when records naturally belong together. The outer dictionary can support a quick lookup by a stable identifier, while the inner dictionary groups descriptive fields for that one record. Use meaningful outer and inner keys so readers can tell whether a value identifies a record or describes it. If the same inner fields repeat across many records, keep their names consistent."],["code","course = {\n    \"CS101\": {\"title\": \"Python Basics\", \"room\": \"204\"}\n}\ncode = \"CS101\"\nif code in course and \"room\" in course[code]:\n    print(course[code][\"title\"], \"meets in\", course[code][\"room\"])"],["out","Python Basics meets in 204"],["p","The condition checks the outer key before looking inside its record, then checks the optional inner field before retrieving it. This staged path is a reliable pattern whenever nested information may be incomplete."],["h","Update a nested entry"],["p","To change a nested value, use the full key path on the left side of an assignment. The outer dictionary is not replaced; the assignment changes one value inside the selected inner dictionary. If a nested value is a list, list methods can update that list as well."],["code","students = {\"S104\": {\"name\": \"Ari\", \"score\": 91}}\nstudents[\"S104\"][\"score\"] = 94\nstudents[\"S104\"][\"name\"] = \"Ari Patel\"\nprint(students[\"S104\"])"],["out","{'name': 'Ari Patel', 'score': 94}"],["p","The score and name are updated within the S104 record. If S104 is not an existing outer key, this expression will fail before Python can reach the inner key. Create the outer record first or check that it exists before changing one of its details."],["h","Loop through nested records"],["p","A loop over the outer dictionary provides each record key and its inner dictionary. From there, the program can use the inner keys to read details. Keeping names such as student_id and record makes the different levels easier to distinguish while you trace the code."],["code","students = {\n    \"S104\": {\"name\": \"Ari\", \"score\": 91},\n    \"S205\": {\"name\": \"Maya\", \"score\": 86}\n}\nfor student_id, record in students.items():\n    print(student_id, record[\"name\"], record[\"score\"])"],["out","S104 Ari 91\nS205 Maya 86"],["p","On each pass, student_id receives an outer key and record receives the matching inner dictionary. The bracket lookups then retrieve the name and score from that one record. If those inner keys are optional, test for their presence before using them or use get() with a suitable default."],["h","Check each level when information may be missing"],["code","students = {\"S104\": {\"name\": \"Ari\"}}\nstudent_id = \"S104\"\nif student_id in students and \"score\" in students[student_id]:\n    print(students[student_id][\"score\"])\nelse:\n    print(\"Score not recorded\")"],["out","Score not recorded"],["p","The first condition checks that the outer key exists. Only then does the second check inspect the inner dictionary. Because and short-circuits, Python will not evaluate students[student_id] if the student ID is absent. This staged check is safer and easier to follow than assuming every record is complete."],["h","Common mistakes"],["ul",["Using an inner key before confirming that the outer record exists.","Forgetting that each level of a nested dictionary needs its own key lookup.","Using unclear names that make it hard to tell the outer key from the inner record."]],["h","Practice"],["p","1. Create a nested dictionary for two books, each with a title and page count."],["p","2. Read the score for student ID \"S205\" from a nested dictionary."],["p","3. Loop through a dictionary of records and print each outer key and one inner value."]]},"69":{"h":"Chapter 6 Review","b":[["p","A dictionary connects unique keys to values, making named information easy to retrieve. Use dictionary[key] when the key is required and get() when a missing value needs a fallback. Assignment adds a new entry or replaces a value; update() handles several entries, while pop(), del, and clear() remove data. The methods keys(), values(), and items() support inspection and loops, and in checks keys by default. Conditionals protect optional lookups and evaluate stored values. Nested dictionaries organize related records in levels, with one key lookup for each level."],["h","Review the dictionary tools"],["tbl",[["Need","Useful pattern","What to check"],["Create or change an entry","data[key] = value","Existing keys are updated; new keys are added."],["Read required information","data[key]","The key must exist or Python raises KeyError."],["Read optional information","data.get(key, default)","The fallback is returned but not stored."],["Check for a key","key in data","Membership checks keys, not values."],["Process each entry","for key, value in data.items():","Avoid adding or deleting keys during traversal."]]],["h","Putting the ideas together"],["p","This small inventory report combines nested dictionaries, membership checks, conditionals, and a loop. Each product key identifies an inner record. The conditional checks that the requested product exists and has stock before calculating its value. The loop then visits every product and counts how many are available."],["code","catalog = {\n    \"notebook\": {\"quantity\": 8, \"price\": 2.5},\n    \"pen\": {\"quantity\": 0, \"price\": 0.75},\n    \"folder\": {\"quantity\": 4, \"price\": 1.25}\n}\nrequested = \"notebook\"\nif requested in catalog and catalog[requested][\"quantity\"] > 0:\n    details = catalog[requested]\n    value = details[\"quantity\"] * details[\"price\"]\n    print(\"Requested item value:\", value)\navailable = 0\nfor item, details in catalog.items():\n    if details[\"quantity\"] > 0:\n        available = available + 1\nprint(\"Available product types:\", available)"],["out","Requested item value: 20.0\nAvailable product types: 2"],["p","The outer membership test prevents a lookup for a product that is not in catalog. The quantity check ensures that the requested product is in stock. The nested values then support a calculation. During the loop, each item key is paired with its details dictionary; the condition counts only records whose quantity is above zero. When tracing similar code, follow the outer key first, then identify the inner dictionary and the value each condition examines."]]},"70":{"h":"Chapter 7: Modules","b":[["p","A module is a collection of Python code that a program can import and use. Modules make common tools available without requiring a programmer to write every feature from scratch. This chapter focuses on using modules that Python provides and packages that other developers publish. You will learn how imports work, how to find specific tools, how to generate random values, and how to consult documentation before using a package."],["h","Learning goals"],["ul",["Explain what a module provides and how it differs from a package.","Import a complete module and use dot notation to access a tool.","Import selected functions and use aliases carefully.","Generate random integers, decimals, and selections with the random module.","Use familiar standard-library modules such as math and statistics.","Find, install, and read documentation for an external package."]],["h","Key terms"],["tbl",[["Term","Meaning"],["Module","A file or library of code that a program can import and reuse."],["Import","A statement that makes a module or selected names available to a program."],["Standard library","Modules included with Python."],["Package","A distribution of reusable code; it may contain one or more importable modules."],["Alias","An alternate name assigned to an imported module or function."],["pip","A tool commonly used to install Python packages."]]]]},"71":{"h":"Lesson 7.1: What Modules Are","b":[["p","A module gives a program access to code that has already been written and organized. A module may contain functions, constants, classes, or other useful tools. For example, Python’s math module includes operations for square roots and other mathematical calculations. The random module provides tools for making random choices. By importing a module, a program can use those features rather than recreating them."],["p","Python includes a standard library: a collection of modules installed with Python. This gives programmers common capabilities such as mathematics, date and time handling, statistics, and random selection. A third-party package is code distributed separately by another developer or organization. Both standard-library modules and third-party packages are accessed through import statements, although external packages may need to be installed first."],["h","Why reuse modules?"],["p","Reusable modules save time and reduce duplicated code. A well-used module often handles details that would be easy to get wrong, such as boundary cases or specialized calculations. Modules also make programs easier to read when the imported tool has a clear purpose. A line such as math.sqrt(81) communicates that the program is using a mathematical square-root function."],["p","Importing a module does not automatically run every example in its documentation. Instead, it makes the module’s named features available to your code. Your program still decides when to call a function and what values to pass to it. Think of an import as bringing a labeled toolbox into reach; you choose which tool to use and when."],["h","Example: use a standard-library module"],["p","The module name is math. The dot separates the module from a function inside it: sqrt belongs to math."],["code","import math\nanswer = math.sqrt(81)\nprint(answer)"],["h","Sample output"],["out","9.0"],["p","The result is displayed as 9.0 because sqrt() returns a floating-point number. The value is mathematically a whole number, but Python keeps the function’s result in a decimal-capable numeric type. The important idea is the access pattern: import the module, then write the module name, a dot, and the feature name."],["h","Common mistakes"],["ul",["Using a module feature before importing the module that contains it.","Leaving out the module name and dot when using the full-module import form.","Assuming every package is included with Python; third-party packages may require installation."]],["h","Practice"],["p","1. In your own words, explain what an import statement makes possible."],["p","2. Name one task that a module could help with instead of writing all the code yourself."],["p","3. Read the example and identify the module name and the function name."]]},"72":{"h":"Lesson 7.2: Importing Modules","b":[["p","The simplest import form names a module directly: import module_name. After that statement, use dot notation to access its functions and values. Dot notation makes the source of a tool visible, which is helpful when several modules have functions with similar names. It also makes code easier to scan because the reader can see which module supplies each capability."],["p","The import statement is normally placed near the beginning of a program, before the imported tools are used. A module can be imported once and then called many times. Importing the module does not call all its functions; a function runs only when the program writes a function call with parentheses. Arguments inside the parentheses provide any information the function needs."],["h","Example: call two functions from one module"],["code","import math\n\narea = math.pi * 3 ** 2\nside = math.ceil(4.2)\nprint(\"Circle area:\", area)\nprint(\"Rounded up:\", side)"],["h","Sample output"],["out","Circle area: 28.274333882308138\nRounded up: 5"],["p","The constant pi and the function ceil() are both accessed through math. The first calculation uses the approximate value of pi to find the area of a circle with radius 3. The second function rounds 4.2 upward to the next integer. Using the module prefix avoids ambiguity about where these names came from."],["h","Import placement and naming"],["p","Import statements are usually grouped at the top of a file so readers can quickly see which modules the program depends on. Keep spelling and capitalization exactly as documented; Python names are case-sensitive. For example, import Math will not import the lowercase module named math. If Python reports that a name is not defined, check that the import ran and that the module prefix is present."],["p","Sometimes a program imports several modules. Each can be named on its own line. This makes errors easier to locate and keeps dependencies clear. You may see multiple imports from the same package in larger programs, but beginners can start with one module per statement and add tools as they are needed."],["h","Common mistakes"],["ul",["Calling sqrt(25) after import math instead of writing math.sqrt(25).","Writing the module name with incorrect capitalization.","Confusing a function name with a module name or forgetting parentheses when calling a function."]],["h","Practice"],["p","1. Import math and calculate the square root of 144."],["p","2. Use math.ceil() to round 6.1 upward and print the result."],["p","3. Explain why math.sqrt() clearly shows where sqrt comes from."]]},"73":{"h":"Lesson 7.3: Importing Specific Tools and Using Aliases","b":[["p","Python can import selected names directly from a module. The form from module_name import tool_name makes that name available without the module prefix. This can make a short program more compact, especially when one function is used repeatedly. A tradeoff is that the source of the name is less visible, so choose this form when the imported name remains clear in context."],["h","Import selected names"],["code","from math import sqrt, pi\n\nradius = 4\narea = pi * radius ** 2\nprint(\"Square root of 64:\", sqrt(64))\nprint(\"Area:\", area)"],["h","Sample output"],["out","Square root of 64: 8.0\nArea: 50.26548245743669"],["p","Only sqrt and pi are imported in this example. The code can use these names directly. If the program later uses another math tool that was not imported, it must either import that name too or import the full math module and use the prefix."],["h","Use aliases to make a name manageable"],["p","An alias is an alternate name created with as. Aliases are useful when a module name is long or when a library has a widely recognized short form. They can also make selected imports distinct from names already used by a program. Keep aliases readable and follow the names shown in package documentation; an unfamiliar abbreviation can make code harder to understand."],["code","import statistics as stats\n\nscores = [72, 84, 91, 84]\nprint(\"Average:\", stats.mean(scores))\nprint(\"Middle value:\", stats.median(scores))"],["h","Sample output"],["out","Average: 82.75\nMiddle value: 84.0"],["p","After the import, stats is the name used to access the statistics module. The alias does not change what the module contains; it only changes how the program refers to it. A common example is import numpy as np, though that package is not required for the examples in this chapter."],["h","Choose an import form"],["p","Use import module when clarity about a tool’s source is important or when you will use several names from that module. Use from module import name when a small number of names are used often and their meaning is clear. Use as when a documented alias improves readability. Avoid importing every name with a wildcard because it can hide where names originated and cause naming conflicts."],["h","Common mistakes"],["ul",["Using the original module name after assigning an alias; use the alias consistently.","Forgetting to import every selected name that the program uses.","Choosing a short alias that is so vague that the code becomes difficult to read."]],["h","Practice"],["p","1. Import sqrt from math and use it to find the square root of 121."],["p","2. Import statistics as stats and use stats.mean() with a list of four numbers."],["p","3. Describe one readability advantage and one drawback of importing a name directly."]]},"74":{"h":"Lesson 7.4: Generating Random Numbers","b":[["p","The random module provides tools for values and selections that can differ from one run to another. Randomness is useful in games, simulations, quizzes, and simple experiments. Import the module before using its tools. Then choose a function based on the kind of result the program needs: a whole-number range, a decimal, or an item selected from a sequence."],["h","Generate a random integer"],["p","random.randint(start, stop) returns an integer from start through stop, including both endpoints. Because both endpoints are possible, randint(1, 6) is a good model for a six-sided die. Always read the documented endpoint behavior; functions with similar names may treat the stopping value differently."],["code","import random\nroll = random.randint(1, 6)\nprint(\"You rolled:\", roll)"],["h","One possible output"],["out","You rolled: 4"],["p","The output is only one possible result. Another run could show a value from 1 to 6. A random program should not rely on one particular outcome unless it deliberately sets up a repeatable test. For everyday learning examples, changing output is expected."],["h","Generate a decimal or select an item"],["p","random.random() returns a decimal greater than or equal to 0.0 and less than 1.0. This can represent a chance: compare the result with a threshold to choose between outcomes. random.choice(sequence) selects one item from a non-empty sequence, such as a list of menu options. If the sequence is empty, there is no item to select, so make sure it contains at least one choice."],["code","import random\n\noptions = [\"left\", \"right\", \"forward\"]\nprint(random.choice(options))\nchance = random.random()\nif chance < 0.5:\n    print(\"Outcome A\")\nelse:\n    print(\"Outcome B\")"],["h","Possible output"],["out","right\nOutcome B"],["p","The selected direction and outcome can change on each run. The if statement uses the generated decimal to select one of two branches. This is a simple demonstration, not a guarantee about fairness in high-stakes systems. Random functions intended for games and simulations are not designed for security-sensitive values such as passwords or secret tokens."],["h","Check range and placement"],["p","Place a random call inside a loop when a new value is needed on each pass. If it is called before the loop and its result is stored in a variable, the loop will reuse that same value unless the variable is updated. Check whether the desired endpoints are possible, whether the answer should be an integer or decimal, and whether the sequence passed to choice() can be empty."],["h","Common mistakes"],["ul",["Assuming randint() excludes its final endpoint; it includes both endpoints.","Expecting the same result each time the program runs.","Calling random.choice() with an empty list.","Reusing one stored random value when a fresh draw is needed during each loop pass."]],["h","Practice"],["p","1. Generate and print an integer from 10 through 20."],["p","2. Use random.choice() to select a color from a list of three colors."],["p","3. Explain why random.random() can be tested with a condition such as chance &lt; 0.5."]]},"75":{"h":"Lesson 7.5: Useful Python Modules","b":[["p","Python’s standard library includes modules for many everyday tasks. The math module provides mathematical constants and calculations. The statistics module summarizes numeric data, including averages and middle values. The datetime module represents dates and times. These tools are included with Python, so a separate package installation is not required for them."],["h","A quick reference"],["tbl",[["Module or tool","What it helps with","Example"],["math.sqrt(number)","Square roots","math.sqrt(49)"],["math.ceil(number)","Round upward to an integer","math.ceil(3.2)"],["statistics.mean(data)","Arithmetic mean","statistics.mean([2, 4, 6])"],["statistics.median(data)","Middle value of ordered data","statistics.median([1, 5, 9])"],["datetime.date.today()","Current calendar date","datetime.date.today()"]]],["p","A reference table is a starting point, not a substitute for checking documentation. Functions can have requirements about the types of arguments they accept. For example, mean() expects numeric data. Some tools return a value that should be stored or printed; others create an object with its own attributes and methods."],["h","Combine tools in a small program"],["code","import math\nimport statistics\n\nmeasurements = [3, 4, 4, 5, 8]\naverage = statistics.mean(measurements)\nrounded_area = math.ceil(math.pi * (average ** 2))\nprint(\"Average measurement:\", average)\nprint(\"Rounded circular area:\", rounded_area)"],["h","Sample output"],["out","Average measurement: 4.8\nRounded circular area: 73"],["p","The program asks statistics for a mean and math for pi and upward rounding. Breaking the work into named variables makes each step easier to inspect. If the output is unexpected, print intermediate values such as average to check the calculation before examining the final expression."],["p","Choose a module by starting with the task. For a square root or a mathematical constant, explore math. For a mean or median, explore statistics. For calendar values, explore datetime. Searching randomly through modules can be overwhelming; a clear question helps identify the right documentation and function. As programs grow, import only tools that are useful and keep module names visible."],["h","Common mistakes"],["ul",["Trying to use a standard-library tool without importing its module.","Confusing an average with a median; they summarize data differently.","Assuming a function accepts any kind of value without checking its expected inputs."]],["h","Practice"],["p","1. Use statistics.mean() to calculate the average of five numbers."],["p","2. Use math.ceil() to round the result upward."],["p","3. Choose a standard-library module for a program that needs the current date and explain your choice."]]},"76":{"h":"Lesson 7.6: Finding and Using External Packages","b":[["p","External packages add tools that are not included in Python’s standard library. Developers publish packages for tasks such as working with data, building websites, or creating visualizations. A package may provide one or more modules that a program imports. Before choosing one, identify the task, check that the package supports your Python version, and read its official documentation or project page."],["p","Many Python packages are installed with pip. A common command is python -m pip install package_name. Using python -m pip helps run pip through the selected Python interpreter, which can reduce confusion when a computer has more than one Python installation. In some environments the command is python3 -m pip. The package’s own instructions should guide the exact command for the environment being used."],["h","Install and import a package"],["code","python -m pip install requests"],["p","After installation, a program can import the package’s module name. Package names and import names are not always identical, so check the documentation. This example only demonstrates the import pattern; it does not make a web request."],["code","import requests\n\nprint(requests.__name__)"],["h","Possible output"],["out","requests"],["p","A package may need to be installed separately in each project environment. If Python reports ModuleNotFoundError immediately after installation, check that pip and the program are using the same interpreter or environment. Restarting a notebook or development environment may also be necessary after installing a package."],["h","Read documentation before relying on a package"],["p","Documentation explains installation, import names, function arguments, return values, examples, and known limitations. Start with a small example from the package’s official documentation and adapt it gradually. Check the package’s maintenance status and compatibility when a project depends on it. Avoid installing a package merely because its name looks relevant; verify that it solves the task and comes from a source you trust."],["p","Some packages offer many tools, so search documentation for the exact task rather than trying unfamiliar functions at random. Record the package name and installation step so another person can reproduce the environment. For a beginner program that uses only print(), lists, or loops, an external package may not be needed at all."],["h","Common mistakes"],["ul",["Using pip to install one name but importing a different name without checking the package instructions.","Installing into one Python environment and running the program in another.","Copying an example without understanding the required arguments or expected output.","Adding a dependency when Python’s standard library already provides the needed feature."]],["h","Practice"],["p","1. Explain the difference between a standard-library module and an external package."],["p","2. Write the general form of a command that installs a package with the active Python interpreter."],["p","3. List three details you would check in a package’s documentation before using it."]]},"79":{"h":"Chapter 7 Review","b":[["p","Modules let a program use reusable code maintained by Python or other developers. The standard library is included with Python; an external package may need to be installed first. With import module, use module.tool to make the source of a name clear. With from module import tool, selected names can be used directly. An alias created with as gives an imported module a different name. The random module can generate integers, decimals, and selections, while math and statistics provide common calculations. Before using an external package, check its import name, installation guidance, compatibility, and documentation."],["h","Review the module tools"],["tbl",[["Need","Possible tool","Check before using"],["Square root","math.sqrt()","The input should be a suitable number."],["Random die roll","random.randint(1, 6)","Both endpoints are included."],["Average of measurements","statistics.mean()","The sequence should contain numeric values."],["External feature","A documented package","Install in the same environment that runs the program."]]],["h","Putting the ideas together"],["p","This example uses the standard library to examine quiz scores, calculate a summary, and generate a random practice question index. The if statement checks that scores exist before calculating a mean. The random selection is performed only when the list has at least one value."],["code","import random\nimport statistics\n\nscores = [76, 88, 92, 81]\nif scores:\n    average = statistics.mean(scores)\n    chosen_index = random.randrange(0, len(scores))\n    print(\"Average:\", average)\n    print(\"Practice score:\", scores[chosen_index])\nelse:\n    print(\"No scores are available\")"],["h","One possible output"],["out","Average: 84.25\nPractice score: 92"],["p","The output may show a different practice score on another run. The average remains the same because the score list is unchanged. The condition prevents the program from selecting an index from an empty list. The example also shows how imports can make a small program clearer: statistics handles the summary, while random chooses which score to display."],["p","When a program depends on an external package, its installation instructions are part of the program’s setup. Keep the import name and package name straight, and make sure the program and installer use the same Python environment. For built-in modules, start with the standard library documentation and verify the function’s inputs and return value. These habits help you reuse code responsibly and understand what a program is asking Python to do."]]},"80":{"h":"Chapter 8: Functions","b":[["p","A function is a named block of code that a program can run whenever it needs that task. You have already used functions such as print(), input(), len(), and math.sqrt(); this chapter shows how to write your own. You will define and call functions, give them information through parameters, get results back with return, control how arguments are supplied, understand which variables each function can see, and combine functions with the collections, conditions, and loops from earlier chapters. The final lesson brings these ideas together with functions that accept flexible parameters and carry out multi-step processes."],["h","Learning goals"],["ul",["Define a function with def and run it with a call.","Pass information into a function with parameters and arguments.","Return a value and explain the difference between returning and printing.","Use default values and keyword arguments to make calls flexible.","Explain which variables a function can see and change.","Use conditionals, loops, lists, tuples, and dictionaries inside functions.","Write advanced functions that accept a flexible number of arguments and divide a larger process into smaller functions."]],["h","Key terms"],["tbl",[["Term","Meaning"],["Function","A named block of code that performs a task and runs when its name is called."],["Definition","The def statement that creates a function and contains its body."],["Call","An expression that runs a function, written as the function name followed by parentheses."],["Parameter","A variable name in a function definition that receives a value when the function is called."],["Argument","A value supplied inside the parentheses of a function call."],["Return value","The value a function sends back to the code that called it."],["Scope","The part of a program where a variable name can be used."],["Default argument","A value that a parameter uses when the call does not supply one."],["Keyword argument","An argument written as name=value in a call."],["Recursion","A function calling itself to solve a smaller version of the same problem."]]]]},"81":{"h":"Lesson 8.1: Introduction to Functions","b":[["p","A function is a named group of instructions. You write the instructions once, give them a name, and then run them by using that name. Python has supplied many functions already: print() displays values, input() collects a
