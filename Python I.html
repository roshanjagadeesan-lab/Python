 does not. Text equality is exact and case-sensitive, so \"maple\" is not equal to \"Maple\". A numeric response from input() is text until you convert it, so convert it before comparing it with a number."],["h","Worked example: check several requirements"],["p","A comparison can be used on its own to see whether a rule is satisfied, or it can become the condition for an if statement. The examples below show equality, inequality, and a boundary comparison. Since score is 82, it is not equal to 100 and it is at least 60. The printed Boolean values let you see each comparison result directly. This is also a useful debugging technique: print a condition while you are learning to check whether it evaluates to the value you expected."],["code","score = 82\nprint(score == 100)\nprint(score != 100)\nprint(score >= 60)\nprint(score < 60)"],["h","Sample output"],["out","False\nTrue\nTrue\nFalse"],["p","The comparison == asks whether two values are equal; it does not change score. The comparison &gt;= includes the boundary, which means a score of exactly 60 meets the condition. By contrast, score &gt; 60 would be False at exactly 60. Thinking through the boundary before choosing the operator prevents errors in age checks, grade cutoffs, and minimum requirements."],["h","Compare like with like"],["p","A response from input() is text, so a number typed as 13 is stored as \"13\". Convert it before comparing it with the integer 13. Text comparisons for equality are exact: capitalization, spaces, and punctuation matter. For example, \"Cat\" and \"cat\" are different strings. Use comparisons to express one precise rule at a time, then combine them with and or or when a decision depends on more than one rule."],["h","Common mistakes"],["ul",["Use == to compare values; a single = assigns a value to a variable.","Choose &gt; versus &gt;= carefully when the boundary itself should count.","Convert numeric input before comparing it with an integer or float."]],["h","Use boundary checks deliberately"],["p","For requirements and ranges, decide explicitly whether the endpoints are included. A minimum age of 13 uses age &gt;= 13; a rule that applies only after the thirteenth birthday would use a different cutoff based on the intended meaning. A range from 13 through 19 includes both endpoints, so check age &gt;= 13 and age &lt;= 19. Try the values 12, 13, 19, and 20 to see where the condition changes. This small set of tests is more informative than trying only a typical value in the middle of the range."],["h","Build comparisons from plain-language rules"],["p","Translate one requirement at a time. “At least 3 attempts” becomes attempts &gt;= 3, while “fewer than 3” becomes attempts &lt; 3. If the boundary should not count, use a strict comparison; if it should count, include the equals sign. A useful check is to test the value just below the boundary, the boundary itself, and the value just above it. Also confirm that the values have compatible types: convert a numeric response from input() before comparing it with an integer or a decimal number."],["h","Practice"],["p","1. Predict whether 10 &gt;= 10, 7 != 7, and \"cat\" == \"Cat\" are True or False."],["p","2. Ask for a number and print a message if it is less than or equal to 100."],["p","3. Write one comparison that checks whether a variable called attempts is exactly 3."]]},"26":{"h":"Lesson 2.6: Logical Operators","b":[["p","Logical operators combine or change Boolean conditions. Use and when every condition must be True, or when at least one condition must be True, and not to reverse a Boolean value."],["tbl",[["Operator","Result is True when...","Example"],["and","Both conditions are True","age >= 13 and age <= 19"],["or","At least one condition is True","day == \"Sat\" or day == \"Sun\""],["not","The condition is False","not is_raining"]]],["h","Truth table"],["tbl",[["A","B","A and B","A or B"],["True","True","True","True"],["True","False","False","True"],["False","True","False","True"],["False","False","False","False"]]],["h","Example: check a range"],["code","age = int(input(\"Your age: \"))\nif age >= 13 and age <= 19:\n    print(\"You are a teenager.\")\nelse:\n    print(\"You are outside the teen age range.\")",""],["p","Parentheses can make compound conditions easier to read, especially when and and or appear together. For example, (day == \"Sat\" or day == \"Sun\") and is_sunny clearly groups the weekend check before combining it with the weather check."],["h","Example: either of two conditions"],["code","has_ticket = True\nis_on_guest_list = False\nif has_ticket or is_on_guest_list:\n    print(\"Entry allowed\")\nelse:\n    print(\"Please check in\")"],["h","Combining complete checks"],["p","Use and when every part of a rule must be true, such as a score being at least 60 and at most 100. Use or when either acceptable option is enough, such as a day being Saturday or Sunday. Use not when the condition should be reversed; if is_locked is False, then not is_locked is True. For a range, writing age &gt;= 13 and age &lt;= 19 checks both boundaries and includes them. When a condition mixes and with or, parentheses make the intended grouping visible to readers and reduce mistakes. Test combinations where all, some, and none of the smaller checks are True."],["h","Worked example: plan a weekend activity"],["p","A real decision often depends on more than one fact. Suppose an outdoor activity is suitable only if it is the weekend and the weather is sunny. The day check has two acceptable possibilities, so those are grouped with or. The weather check must also be True, so and joins it to the grouped day check. Parentheses make the intended relationship visible: either weekend day is acceptable, but sunshine is required in addition."],["code","day = \"Sun\"\nis_sunny = True\nif (day == \"Sat\" or day == \"Sun\") and is_sunny:\n    print(\"Plan an outdoor activity\")\nelse:\n    print(\"Choose an indoor activity\")"],["h","Sample output"],["out","Plan an outdoor activity"],["p","For Sunday, the Saturday check is False and the Sunday check is True, so the expression in parentheses is True. The weather condition is also True. Since both sides of and are True, the program chooses the outdoor activity. If the day were Monday, the grouped day check would be False and the full condition would be False even if it were sunny."],["h","Translate the rule into smaller checks"],["p","Before writing a compound condition, say the rule in plain language and identify which parts must all be true and which parts are alternatives. Use and for required conditions, or for acceptable alternatives, and not when a condition must be reversed. Parentheses group alternatives so that the code matches the sentence. Test combinations that include a weekend day with sun, a weekend day without sun, and a weekday with sun. Those examples show whether each part of the rule is doing its intended job."],["h","Common mistakes"],["ul",["Use or for alternatives; and would require both alternatives to be true at once.","Group related checks with parentheses when a condition mixes and and or.","not reverses one Boolean condition; check that it applies to the intended value."]],["p","Use parentheses when several conditions appear together, even when precedence would produce the same result. Parentheses show which parts form a group and make a rule easier to check. For example, a program might allow entry to students or staff, then combine that group with a second requirement such as having a ticket. Test different Boolean values to confirm how and, or, and not change the final result."],["h","Combine conditions carefully"],["h","Practice"],["p","1. Ask for a username and a password. Print \"Access granted\" only when both match their expected values."],["p","2. Ask for a day of the week and print \"Weekend\" when it is Saturday or Sunday."],["p","3. Use not with a Boolean variable called is_locked to print \"Unlocked\" only when the value is False."]]},"29":{"h":"Chapter 2 Review","b":[["p","Conditionals let a program choose which instructions to run. An if statement checks the first condition; elif adds further possibilities, and else provides a default path when none of the earlier conditions are true. Python runs only the first matching branch in an if/elif/else chain, so order conditions from most specific or highest threshold to the appropriate later cases. Comparison operators such as ==, !=, &lt;, &lt;=, &gt;, and &gt;= produce True or False; use == to compare values and = to assign a value. The logical operators and, or, and not combine or reverse Boolean checks. Indentation defines each block, and nested if statements place one decision inside another. Test ordinary, boundary, and unexpected inputs to make sure every path behaves as intended."],["h","Trace a complete decision"],["p","A conditional program combines comparison results with ordered branches. In the example, Python checks whether score is at least 90. If that test is False, it checks whether score is at least 70. For a score of 84, the first test fails and the second succeeds, so the program prints B. The final else is used only when neither condition matches."],["code","score = 84\nif score >= 90:\n    print(\"A\")\nelif score >= 70:\n    print(\"B\")\nelse:\n    print(\"Keep practicing\")"],["h","Reviewing a decision path"],["p","Trace each condition from top to bottom and stop at the first True result. Use comparison operators to express precise boundaries, then and, or, or not when one decision depends on several Boolean checks. Indentation shows which instructions belong to each branch; in a nested statement, trace the outer condition before following an inner one. Testing values at the boundary and on either side helps confirm that all expected cases follow the intended path."]]},"30":{"h":"Chapter 3: Loops","b":[["p","Loops let a program repeat instructions without copying the same statements over and over. A while loop repeats as long as a condition stays True; a for loop processes each value in a sequence. You will also learn to stop or skip iterations, nest loops to work with repeated groups, and use conditionals inside loops to respond to each value or event. These tools help build programs that count, search, filter, and respond."],["h","Learning goals"],["ul",["Choose a while loop for repetition controlled by a condition and a for loop for a known sequence.","Use range() to generate a sequence of whole numbers.","Use break and continue to control the current loop.","Trace nested loops and create simple repeated patterns.","Use if, elif, and else inside loops to make decisions about each repetition."]],["h","Key terms"],["tbl",[["Term","Meaning"],["Loop","A structure that repeats a block of instructions."],["Iteration","One pass through a loop body."],["Loop body","The indented instructions that run during each iteration."],["Sequence","An ordered set of values a for loop can process."]]]]},"31":{"h":"Lesson 3.1: While Loops","b":[["p","A while loop repeats an indented block as long as its condition is True. Python checks the condition before every pass, so a condition that is False at the start skips the body entirely. A while loop is useful when the number of repetitions depends on information that may change while the program runs."],["h","Indefinite repetition and when to use while"],["p","A while loop is often called an indefinite loop because you usually cannot know how many times it will run before its condition changes. Use it when repetition should continue until an event or response occurs, such as asking for valid input, keeping a game running while a player is active, or accepting commands until the user enters “quit.” The count-to-three example below is deliberately small and bounded for tracing; when a program knows it needs exactly three passes, a for loop is usually clearer."],["h","Example: count to three"],["code","count = 1\nwhile count <= 3:\n    print(count)\n    count = count + 1"],["h","Sample output"],["out","1\n2\n3"],["p","Python begins with count equal to 1. The test count &lt;= 3 is True, so it prints 1 and updates count to 2. The same steps repeat for 2 and 3. After the last update, count is 4; the condition is now False, so the loop ends and execution continues after the indented block."],["h","Parts of a while loop"],["p","A while loop needs a starting value, a condition, a body, and usually an update. The condition determines whether another pass should run. The body contains the repeated work. An update changes a value used by the condition so the loop can eventually stop. Keeping these parts easy to identify makes a loop simpler to trace and revise."],["tbl",[["Part","Role","Example"],["Starting value","Sets the first state","count = 1"],["Condition","Decides whether to repeat","count <= 3"],["Body","Instructions repeated","print(count)"],["Update","Moves toward stopping","count = count + 1"]]],["h","Avoid an infinite loop"],["p","If the loop never changes a value that affects its condition, the test may stay True forever. For example, if count starts at 1 and the body only prints count, count &lt;= 3 will remain True on every pass. Add an update that moves the state toward the stopping condition. Also check the boundary carefully: changing &lt;= to &lt; changes whether the final value is included."],["code","count = 1\nwhile count <= 3:\n    print(count)\n    count = count + 1"],["p","The update belongs inside the loop so it runs once per iteration. If it is placed after the loop, Python cannot reach it until the loop has already ended. Indentation therefore affects both which lines repeat and whether the program can make progress toward a stopping point."],["h","Common mistakes"],["ul",["Forgetting to update the loop variable can create an infinite loop.","Indenting the update outside the loop prevents it from running on each pass.","Using the wrong comparison can repeat too many times or stop too early."]],["h","Trace the changing value"],["p","A short trace makes it easier to check that the condition and update work together. The value printed during a pass is the current count; the update prepares the value for the next test."],["tbl",[["Check","Count","Condition","Action"],["Pass 1","1","True","Print 1; update to 2"],["Pass 2","2","True","Print 2; update to 3"],["Pass 3","3","True","Print 3; update to 4"],["Next check","4","False","Exit the loop"]]],["h","Wait for a response"],["code","answer = \"\"\nwhile answer != \"done\":\n    answer = input(\"Type done to finish: \")\nprint(\"Finished\")","later"],["h","Sample run"],["out","Type done to finish: later\nType done to finish: done\nFinished"],["p","This loop does not know how many responses will be entered. It repeats until the response exactly matches done. Because text comparisons are case-sensitive, Done would not end this example. A while loop is a good fit when the stopping point depends on a condition that can change during the program."],["h","Practice"],["p","1. Use a while loop to print the numbers 1 through 5."],["p","2. Start at 10 and count down to 1, updating the number once per pass."],["p","3. Describe what happens if a loop condition is False before the first check."]]},"32":{"h":"Lesson 3.2: For Loops","b":[["p","A for loop runs once for each value in an iterable sequence. The loop variable receives the next value automatically, which makes for a natural choice when the values are already available or the number of repetitions is known. Python can loop over text one character at a time, or over numbers produced by range()."],["h","Definite repetition and when to use for"],["p","A for loop is a definite loop when it processes a finite sequence or range: the available values determine how many passes it makes. Use it to repeat a task a set number of times, calculate a total over a range, or process every name, score, or character in a collection. The examples below show both patterns: range(1, 4) supplies three numbers, and the string “cat” supplies three characters. Python advances to the next value automatically, so a for loop is a natural choice when the work is organized around each item or a known count."],["h","Example: use range()"],["code","for day in range(1, 4):\n    print(\"Day\", day)"],["h","Sample output"],["out","Day 1\nDay 2\nDay 3"],["p","range(1, 4) produces 1, 2, and 3. The stop value 4 is excluded. On each pass, day takes the next value, the indented print() runs, and Python moves on. There is no separate update statement because the for loop advances through the sequence for you."],["h","Read a range carefully"],["p","range() can take a stop value, a start and stop, or a start, stop, and step. The start is included and the stop is not. A positive step moves upward; a negative step can count downward. Check the first and last values you expect before using a range in a calculation."],["tbl",[["Expression","Values produced","How to read it"],["range(4)","0, 1, 2, 3","Start at 0; stop before 4"],["range(2, 5)","2, 3, 4","Start at 2; stop before 5"],["range(2, 11, 3)","2, 5, 8","Start at 2; add 3; stop before 11"]]],["h","Example: loop through text"],["code","for letter in \"cat\":\n    print(letter)"],["h","Sample output"],["out","c\na\nt"],["p","A string is a sequence of characters, so the loop variable letter holds one character during each pass. The same pattern works for any string. Avoid changing the loop variable to a different value inside the body unless there is a clear reason; Python will assign the next sequence value when it starts the following iteration."],["h","Worked example: add a known range"],["p","A for loop can also keep a running total. Begin with a total of zero, then add each number from the range. This example includes 1 through 4 because the stop value is 5:"],["code","total = 0\nfor number in range(1, 5):\n    total = total + number\nprint(\"Total:\", total)"],["h","Sample output"],["out","Total: 10"],["p","The total changes from 0 to 1, then 3, then 6, and finally 10. Each update uses the current total and the current value of number. After range() is exhausted, Python leaves the loop and prints the finished result."],["h","Common mistakes"],["ul",["Remember that range() stops before its final argument.","Indent the statements that should run once for every value.","Use a new loop variable name that describes the current value."]],["h","Count down with a negative step"],["code","for number in range(6, 0, -2):\n    print(number)"],["h","Sample output"],["out","6\n4\n2"],["p","The start value 6 is included. Each pass subtracts 2, and the loop stops before reaching 0. The step needs to be negative for this range to move downward. A range with a positive step and a larger start than stop would contain no values, so the loop body would not run."],["h","Use for when the sequence is clear"],["p","A for loop is especially readable when you can name the values it should visit before the loop begins. Use range() for a numeric sequence and a string when each character should be handled in order. If repetition should continue until a changing condition becomes False, a while loop communicates that rule more directly."],["h","Step through a custom sequence"],["code","for step in range(0, 8, 3):\n    print(\"Step\", step)"],["h","Sample output"],["out","Step 0\nStep 3\nStep 6"],["p","The step argument controls the distance between values. Here, the loop starts at 0, adds 3 each time, and stops before 8. The final value is 6 because the next value would be 9, which is beyond the stopping point. This pattern is useful for selecting evenly spaced values."],["h","Practice"],["p","1. Use range() to print the numbers 0 through 6."],["p","2. Loop over the word Python and print one character per line."],["p","3. Add the numbers 2, 4, 6, and 8 with a for loop."]]},"33":{"h":"Lesson 3.3: Controlling Loops","b":[["p","Most loops continue until their sequence ends or their while condition becomes False. The break and continue statements let a program change that normal flow. Use break to leave the nearest loop immediately. Use continue to skip the rest of the current iteration and begin the next one."],["h","Example: stop with break"],["code","for number in range(1, 6):\n    if number == 4:\n        break\n    print(number)"],["h","Sample output"],["out","1\n2\n3"],["p","When number becomes 4, the condition is True and break exits the loop. Python skips any remaining statements in the body and continues with the first statement after the loop. The value 4 is not printed because print() comes after the break check."],["h","Example: skip one value with continue"],["code","for number in range(1, 6):\n    if number == 3:\n        continue\n    print(number)"],["h","Sample output"],["out","1\n2\n4\n5"],["p","When number is 3, continue skips the print() call for that pass. It does not end the loop: Python advances to 4 and continues normally. Use continue when one case should be ignored but later values still need to be processed."],["h","Choose the right control statement"],["p","break ends the current loop; continue only skips the current pass. Both affect the loop they are inside. In nested loops, break leaves only the nearest enclosing loop. This distinction is useful when an inner search should stop while an outer loop continues with another group."],["tbl",[["Statement","Effect","Typical use"],["break","Exit the nearest loop","A target has been found"],["continue","Skip to the next iteration","Ignore one value"],["No control statement","Finish the body, then repeat","Process every value"]]],["h","Use continue safely in a while loop"],["p","In a while loop, make sure the update still happens even on a pass that uses continue. If continue jumps over the only update, the condition may remain True forever. Place the update before the check or structure the body so every path changes the state."],["code","count = 0\nwhile count < 5:\n    count = count + 1\n    if count == 3:\n        continue\n    print(count)"],["h","Sample output"],["out","1\n2\n4\n5"],["h","Common mistakes"],["ul",["Using break when later values should still be checked.","Assuming continue ends a loop; it only skips the current iteration.","Placing continue before a while-loop update that must always run."]],["h","Stop a search when the target appears"],["code","for digit in \"5836\":\n    if digit == \"3\":\n        print(\"Found 3\")\n        break\n    print(\"Checking\", digit)"],["h","Sample output"],["out","Checking 5\nChecking 8\nFound 3"],["p","The loop checks each character in order. When the target is found, break ends the search so the remaining characters are not checked. If the target never appears, the loop reaches the end of the string normally. This pattern is useful when later work is unnecessary after a match."],["h","Practice"],["p","1. Print 1 through 10, but stop before printing 7."],["p","2. Print 1 through 8 while skipping 5."],["p","3. Explain how break and continue differ in a loop that searches for a value."]]},"34":{"h":"Lesson 3.4: Nested Loops","b":[["p","A nested loop is a loop inside another loop. For every pass of the outer loop, the inner loop runs through all of its values. This pattern is useful for rows and columns, repeated groups, and combinations of two sequences. Indentation shows which statements belong to each loop."],["h","Example: visit rows and columns"],["code","for row in range(1, 4):\n    for column in range(1, 3):\n        print(\"Row\", row, \"column\", column)"],["h","Sample output"],["out","Row 1 column 1\nRow 1 column 2\nRow 2 column 1\nRow 2 column 2\nRow 3 column 1\nRow 3 column 2"],["p","The outer loop sets row to 1, then the inner loop visits column 1 and 2. Only after both inner passes finish does the outer loop move to row 2. The inner loop then starts again from its first value. With three outer values and two inner values, the body runs six times."],["h","Trace each level"],["p","When you read nested loops, track the outer and inner variables separately. The inner loop variable changes more often; the outer variable changes only after the inner sequence is complete. Writing down a few passes can reveal whether a statement belongs inside the inner loop, inside the outer loop, or after both loops."],["h","Worked example: build a multiplication grid"],["p","The inner loop can print a row of products, while the outer loop starts a new row. The empty print() runs after the inner loop finishes each row:"],["code","for row in range(1, 4):\n    for column in range(1, 4):\n        print(row * column, end=\" \")\n    print()"],["h","Sample output"],["out","1 2 3 \n2 4 6 \n3 6 9"],["p","For row 2, the inner loop multiplies 2 by 1, 2, and 3. The final print() starts a new line before the next outer pass. Moving that print() into the inner loop would change the layout because it would start a new line after every product."],["h","Keep the indentation levels clear"],["p","The inner loop must be indented inside the outer loop. Its body needs one additional indentation level. Statements aligned with the outer loop run once per outer pass; statements aligned with the inner loop run once for every pair of values. A clear choice of names such as row and column helps make those roles visible."],["h","Common mistakes"],["ul",["Indenting the inner loop at the same level as the outer loop makes it independent.","Updating or printing at the wrong indentation level changes how often it runs.","Forgetting that the full inner loop repeats for every outer value."]],["h","Let the inner range depend on the outer value"],["p","A nested loop can create rows whose lengths depend on the row number. The outer loop chooses how many rows to draw; the inner range determines how many symbols appear in each row. When row is 1, the inner loop runs once; when row is 3, it runs three times."],["h","Example: print a growing triangle"],["code","for row in range(1, 4):\n    for column in range(1, row + 1):\n        print(\"*\", end=\"\")\n    print()"],["h","Sample output"],["out","*\n**\n***"],["h","Trace the rows"],["tbl",[["Row value","Inner values","Symbols printed"],["1","1","*"],["2","1, 2","**"],["3","1, 2, 3","***"]]],["p","The inner loop runs a total of six times for this pattern: one pass in the first row, two in the second, and three in the third. The final print() is aligned with the outer loop, so it starts a new line only after each row is complete. Changing its indentation would change the shape of the output."],["h","Practice"],["p","1. Use nested loops to print every pair made from values 1 and 2 in each loop."],["p","2. Create a 3-by-4 rectangle of asterisks using nested loops."],["p","3. How many times does the inner body run when the outer loop has 4 values and the inner loop has 3?"]]},"35":{"h":"Lesson 3.5: Conditionals in Loops","b":[["p","A loop repeats instructions, and a conditional lets a program choose what to do. When these structures are combined, Python can examine each value or event and respond differently depending on what it finds. This pattern is useful for classifying scores, checking inventory, counting matching items, and validating repeated input. The loop controls when the program looks again; the conditional controls what happens during each pass."],["h","Use a conditional for each value"],["p","In a for loop, the loop variable changes on every pass. An if, elif, and else chain can classify the current value. Python checks conditions from top to bottom and runs only the first matching branch. The example assigns a category to each score, then continues to the next score after printing one result."],["h","Example: classify a set of scores"],["p","The ranges are written so that each score belongs to one category. A score of 90 is included in the first branch because the comparison uses &gt;=. The else branch handles every remaining value."],["code","scores = [96, 82, 68, 54]\nfor score in scores:\n    if score >= 90:\n        print(score, \"A\")\n    elif score >= 80:\n        print(score, \"B\")\n    elif score >= 70:\n        print(score, \"C\")\n    else:\n        print(score, \"Needs more practice\")"],["h","Sample output"],["out","96 A\n82 B\n68 Needs more practice\n54 Needs more practice"],["p","The first score is tested against 90, then 80 only if the first condition is False. The loop repeats this decision process for every element in scores. A score below 70 falls into the final else branch, so the program does not need a separate condition for every possible low score."],["h","Count values that meet a condition"],["p","A loop can update a counter only when an item meets a condition. Set the counter before the loop so it has one starting value. Then increase it inside the matching branch. This is conditional counting: every item is examined, but only some items change the total."],["code","temperatures = [18, 22, 27, 30, 16]\nwarm_days = 0\nfor temperature in temperatures:\n    if temperature >= 25:\n        warm_days += 1\nprint(\"Warm days:\", warm_days)"],["h","Sample output"],["out","Warm days: 2"],["p","The comparison is performed once for each temperature. Only 27 and 30 are at least 25, so warm_days increases twice. The counter is printed after the loop, when all values have been checked. If print() were indented inside the loop, the program would display a partial count after every pass instead."],["h","Make decisions in a while loop"],["p","A while loop can use a conditional in its body to respond to the current state. The condition may change inside a branch, and that change can determine whether the loop repeats. Make sure every path through the loop either updates the state or exits; otherwise, the program may repeat forever."],["code","remaining = 5\nwhile remaining > 0:\n    if remaining == 2:\n        print(\"Almost there\")\n    else:\n        print(\"Remaining:\", remaining)\n    remaining -= 1\nprint(\"Finished\")"],["h","Sample output"],["out","Remaining: 5\nRemaining: 4\nRemaining: 3\nAlmost there\nRemaining: 1\nFinished"],["p","The while condition checks remaining before every pass. The if statement changes the message only when the value is 2; the decrement still runs after either branch. Eventually remaining becomes 0, the loop condition is False, and execution continues after the loop."],["h","Common mistakes"],["ul",["Indenting a counter update outside the branch that should control it, which can count every item instead of only matches.","Using separate if statements when later cases should be skipped after an earlier match; use elif for one exclusive classification.","Forgetting to update a value used by a while condition, which can create an infinite loop.","Printing an intermediate result inside a loop when the final total should appear only after all items have been processed."]],["h","Practice"],["p","1. Loop through a list of numbers and print whether each number is positive, negative, or zero."],["p","2. Count how many values in [12, 19, 25, 31, 8] are at least 20."],["p","3. Write a while loop that asks for a word until the user enters \"stop\", then prints a message for each other word."]]},"39":{"h":"Chapter 3 Review","b":[["p","Loops repeat instructions while a condition is True or for each value in a sequence. A while loop is controlled by a condition, so the body must move the program toward a stopping point. A for loop advances through a sequence such as range() or a string. break exits the nearest loop, while continue skips the rest of one iteration. Nested loops repeat the full inner sequence for every outer value. Conditionals inside loops let a program classify, count, and respond to values as they are processed."],["h","Choose the right loop"],["tbl",[["Structure","Use it when..."],["while","Repetition depends on a condition or event."],["for","Values or repetitions come from a sequence."],["break","The current loop should end immediately."],["continue","One iteration should be skipped, but later ones should run."]]],["h","Trace a running total"],["p","The example combines range() with a running total. Start at zero, then follow each value from 1 through 4. After each pass, the new total is used on the next pass:"],["code","running_total = 0\nfor value in range(1, 5):\n    running_total = running_total + value\nprint(\"Total:\", running_total)"],["h","Sample output"],["out","Total: 10"],["p","To check a loop, identify the values it will visit, the condition that controls another pass, and any statement that changes the state. For nested loops, trace the inner sequence once for each outer value. When a conditional appears inside a loop, follow each value through the conditions and verify that counters change only when intended. These checks help confirm that the loop stops at the right time and produces the intended result."]]},"40":{"h":"Chapter 4: Lists","b":[["p","A list stores related values in a single ordered collection. Lists make it practical to keep track of scores, names, supplies, and other groups of information. In this chapter, you will create lists, read values by position, update their contents, use list operators, make decisions based on list data, and repeat an action for each item."],["h","Learning goals"],["ul",["Create lists and recognize how elements are ordered.","Read list elements with positive and negative indexes and select a slice.","Change lists by assigning values and using common list methods.","Combine lists, repeat list patterns, and test membership.","Use conditions and loops to make decisions about list contents."]],["h","Key terms"],["tbl",[["Term","Meaning"],["List","An ordered, changeable collection of values."],["Element","One value stored in a list."],["Index","The position number used to access an element."],["Mutable","Able to be changed after it is created."],["Slice","A selected range of elements from a sequence."]]]]},"41":{"h":"Lesson 4.1: Intro to Lists","b":[["p","A list groups several values under one variable name. Put the values inside square brackets and separate them with commas. Lists keep their elements in order, so Python can retrieve a value by its position. A list can hold strings, numbers, or other kinds of values; for beginner programs, a list of related values with the same type is often easiest to work with."],["h","Create a list"],["code","colors = [\"blue\", \"green\", \"gold\"]\nscores = [84, 91, 76]\nprint(colors)\nprint(scores)"],["h","Sample output"],["out","['blue', 'green', 'gold']\n[84, 91, 76]"],["p","The variable colors refers to one list containing three strings, while scores refers to a list containing three integers. The brackets in the output show that Python is displaying a list. The quotes show that the color names are text. The order is meaningful: blue is the first element, green is the second, and gold is the third."],["h","Lists can grow from an empty starting point"],["p","An empty list is written as []. It is useful when a program will collect values as it runs. The len() function reports how many elements are currently stored. If there are no elements, len() returns 0. This gives a program a simple way to check whether a list has anything to process."],["code","responses = []\nprint(len(responses))\nresponses = [\"yes\", \"no\"]\nprint(len(responses))"],["h","Sample output"],["out","0\n2"],["h","Why group values in a list?"],["p","Without lists, a program that tracks several quiz scores might need a separate variable for every score. A list keeps those values together so one loop or calculation can work with the group. Lists are useful for a playlist, a set of temperatures, a shopping cart, a sequence of menu choices, or answers collected from a quiz. The shared variable name identifies the collection; each position identifies one value."],["h","Lists keep order and allow repeated values"],["p","A list records values in the order they are added, and the same value can appear more than once. This matters when the collection represents events or choices rather than a set of unique names. len() counts every element, including duplicates, and type() can confirm that a variable refers to a list."],["code","visitors = [\"Maya\", \"Luis\", \"Maya\"]\nprint(visitors)\nprint(len(visitors))\nprint(type(visitors))"],["h","Sample output"],["out","['Maya', 'Luis', 'Maya']\n3\n<class 'list'>"],["p","The repeated name is stored twice because it represents two visits. A list is useful when order and repeated entries matter. Group related values together, and use separate lists for separate kinds of information, such as names and temperatures. This makes the purpose of each collection easier to understand as the program grows."],["h","Start with the shape of the data"],["p","Before writing a list, decide what one element represents and whether the order matters. A list of quiz scores has one score per element; a list of daily temperatures has one day’s reading per element. A meaningful variable name such as scores or temperatures helps explain the collection without needing a comment on every line."],["p","A list can also collect values entered at different times. Each input response becomes one element, so the program can keep the answers together and later loop over them or measure their count. This is a simple pattern for a short poll, a list of preferences, or a set of labels typed by a user."],["h","Collect two responses"],["code","first_color = input(\"First color: \")\nsecond_color = input(\"Second color: \")\ncolors = [first_color, second_color]\nprint(colors)","teal;gold"],["h","Sample run"],["out","First color: teal\nSecond color: gold\n['teal', 'gold']"],["p","The list is created after Python receives both responses. It contains two strings in the same order the user entered them. If another response is collected later, append() can add it to the existing list; the next lessons explain how to change and process a list."],["h","How Python represents a list"],["p","A list is one object that contains several element values in a particular order. The variable name refers to the whole collection; an index identifies one element inside it. This distinction helps explain why colors and colors[0] mean different things: colors refers to the list, while colors[0] refers to one value stored in the list. A list can contain values of different types, although collections with one clear purpose are usually easier to understand."],["code","record = [\"Mina\", 14, True]\nprint(record)\nprint(record[0])\nprint(type(record))"],["out","['Mina', 14, True]\nMina\n<class 'list'>"],["p","The square brackets create the collection, and commas mark the boundaries between elements. The string, integer, and Boolean remain individual values inside the same list. In many programs, each element has the same type, such as a list of scores, because that makes later calculations and comparisons predictable. A mixed list can still be useful when the values describe one record, but a dictionary is often a better fit once each value needs a named role."],["h","Lists can contain other lists"],["p","A list element can itself be a list. This creates a nested structure, which is useful for rows of a grid or groups of related values. At this stage, think of the outer list as holding several smaller lists; later, you can use one index for the row and another for a value within that row."],["code","seats = [[\"A1\", \"A2\"], [\"B1\", \"B2\"]]\nprint(seats)"],["out","[['A1', 'A2'], ['B1', 'B2']]"],["p","Choose lists when the order of items matters, when duplicates are meaningful, or when the collection may grow or shrink. For example, a queue of names keeps the arrival order, and a score history may contain the same score more than once. If you only need to record a single fact, a simple variable is clearer; if you need to retrieve information by a descriptive key, another data structure may be more suitable."],["h","Common mistakes"],["ul",["Forgetting square brackets or commas makes the list syntax invalid.","Leaving quotation marks off a word makes Python treat it as a variable name.","Assuming a list automatically sorts its values; elements stay in the order you provide."]],["h","Practice"],["p","1. Create a list named pets with three animal names, then print the list."],["p","2. Create a list of four whole-number temperatures and use len() to display its size."],["p","3. Write an empty list for collecting names that will be entered later."]]},"42":{"h":"Lesson 4.2: Accessing Lists","b":[["p","Each list element has an index, or position number. Python starts counting indexes at 0, so the first element is at index 0 and the second is at index 1. This zero-based pattern is used throughout Python. To access one value, write the list name followed by the index in square brackets."],["h","Read elements by index"],["code","days = [\"Mon\", \"Tue\", \"Wed\", \"Thu\"]\nprint(days[0])\nprint(days[2])"],["h","Sample output"],["out","Mon\nWed"],["p","The expression days[0] retrieves Mon, not Tue, because the first position is zero. Positive indexes count from the beginning. Negative indexes count backward from the end: -1 is the last element, -2 is the element before it, and so on. Negative indexes are helpful when a program needs the most recent value without calculating the final positive index."],["tbl",[["Expression","Value","Position"],["days[0]","Mon","First element"],["days[1]","Tue","Second element"],["days[-1]","Thu","Last element"],["days[-2]","Wed","Second from the end"]]],["h","Select a slice"],["p","A slice selects more than one element. The start index is included and the stop index is excluded, so days[1:3] contains the values at indexes 1 and 2. A slice creates a new list containing the selected values. You can leave out the start to begin at the first element or leave out the stop to continue to the end."],["code","print(days[1:3])\nprint(days[:2])\nprint(days[2:])"],["h","Sample output"],["out","['Tue', 'Wed']\n['Mon', 'Tue']\n['Wed', 'Thu']"],["h","Check the valid range"],["p","An index must refer to an element that exists. For a list with four values, valid positive indexes are 0 through 3. Asking for days[4] causes an IndexError. Use len(days) to find the number of elements; the final positive index is len(days) - 1. Before using a position that may not exist, check the list length or use a loop that visits only available elements."],["h","Use length to calculate a position"],["p","len(list) reports the number of elements, not the last index. Since the first index is 0, the final positive index is one less than the length. Calculating that position is useful when a program needs the final element but does not know how many values the list contains. For an empty list, there is no final element, so check that the list contains values before calculating or using an index."],["code","days = [\"Mon\", \"Tue\", \"Wed\", \"Thu\"]\nlast_index = len(days) - 1\nprint(last_index)\nprint(days[last_index])"],["h","Sample output"],["out","3\nThu"],["p","This pattern uses the same relationship for a list of any length. Negative indexing can be shorter when the goal is simply “the last element,” but a calculated index is helpful when an index itself must be stored or compared."],["h","Use a step to select a regular pattern"],["p","A slice can include a third value called the step: list[start:stop:step]. The step tells Python how far to move between selected indexes. A step of 2 selects every other element. The start is still included and the stop is still excluded, even when a step is present."],["code","numbers = [0, 1, 2, 3, 4, 5]\nprint(numbers[::2])\nprint(numbers[1::2])"],["h","Sample output"],["out","[0, 2, 4]\n[1, 3, 5]"],["p","The first slice selects the values at indexes 0, 2, and 4. The second begins at index 1 and selects 1, 3, and 5. Slices can be useful for splitting alternating values or taking regularly spaced readings, while ordinary indexing remains the clearest choice for one element."],["h","Trace an index carefully"],["p","An index is a position, not a count of how many elements have been passed. Because counting begins at zero, the index and the human-friendly position differ by one: position 1 is index 0, position 2 is index 1, and so on. Before reading an element, check the list length and make sure the requested index is within the valid range. The last valid positive index is len(values) - 1; an empty list has no valid index at all."],["code","letters = [\"a\", \"b\", \"c\", \"d\"]\nfor index in range(len(letters)):\n    print(\"index\", index, \"contains\", letters[index])"],["out","index 0 contains a\nindex 1 contains b\nindex 2 contains c\nindex 3 contains d"],["h","Slices make a new outer list"],["p","A slice copies a selected range into a new list. The start is included and the stop is excluded, so a slice from index 1 to index 4 contains positions 1, 2, and 3. Leaving the start blank begins at the front; leaving the stop blank continues to the end. A slice can be useful for selecting a section without changing the source list. For a list of simple values such as integers or strings, the selected values are easy to reason about; with nested lists, the inner lists are still shared references."],["code","week = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]\nmidweek = week[1:4]\nmidweek[0] = \"Tuesday\"\nprint(midweek)\nprint(week)"],["out","['Tuesday', 'Wed', 'Thu']\n['Mon', 'Tue', 'Wed', 'Thu', 'Fri']"],["p","Changing the string in midweek does not change week because the slice has its own outer list. This is one reason slices are useful for making a working selection. When a list contains mutable objects inside it, such as other lists, copying the outer list does not automatically copy every inner object; that distinction becomes important in more advanced programs."],["h","Common mistakes"],["ul",["Using 1 for the first element instead of 0 shifts every selection by one.","Using an index equal to len(list) goes past the final element.","Expecting the stop index in a slice to be included; Python stops before it."]],["h","Practice"],["p","1. Given values = [5, 8, 12, 20], print the first and last values."],["p","2. Use a slice to select 8 and 12 from the values list."],["p","3. What index selects the final value when a list has six elements?"]]},"43":{"h":"Lesson 4.3: Modifying Lists","b":[["p","Lists are mutable, which means their contents can change after the list is created. Assign a new value to an existing index to replace one element. List methods can add or remove elements. These operations change the same list, so a variable that refers to it will show the updated contents."],["h","Replace an element"],["code","colors = [\"blue\", \"green\", \"gold\"]\ncolors[1] = \"purple\"\nprint(colors)"],["h","Sample output"],["out","['blue', 'purple', 'gold']"],["p","The assignment changes the element at index 1. It does not add a fourth element; the list still has three values. Choose an index that already exists when replacing an item. To add an item, use a method such as append() or insert()."],["h","Common ways to change a list"],["tbl",[["Operation","What it does","Example"],["append(value)","Adds value at the end.","colors.append(\"red\")"],["insert(index, value)","Adds value before an index.","colors.insert(0, \"black\")"],["remove(value)","Removes the first matching value.","colors.remove(\"green\")"],["pop(index)","Removes and returns a value.","last = colors.pop()"],["clear()","Removes every element.","colors.clear()"]]],["h","Add and remove with purpose"],["p","append() is useful when new information arrives at the end, such as another score or a new task. insert() is useful when an item belongs at a specific position. remove() searches for a matching value and deletes its first occurrence. pop() removes an element by position and gives that removed value back; when no index is supplied, it removes the final element. Use these methods according to whether you know a value or a position."],["code","tasks = [\"read\", \"study\"]\ntasks.append(\"practice\")\ntasks.insert(1, \"review\")\nfinished = tasks.pop(0)\nprint(finished)\nprint(tasks)"],["h","Sample output"],["out","read\n['review', 'study', 'practice']"],["h","Choose a safe update"],["p","An index assignment such as tasks[3] = \"submit\" only works if index 3 already exists. It cannot extend a shorter list by itself. Use append() to add at the end or insert() to add at a chosen position. remove() raises a ValueError if the requested value is absent, so check membership with in first when the value may not be present. pop() also needs an existing index if you provide one."],["h","Sort or reverse the current order"],["p","The sort() method arranges a list in ascending order in place, which means it changes the existing list. For numbers, ascending order goes from smallest to largest; for strings, the ordering is alphabetical by character code. reverse() reverses the current order. It does not sort the values first, so use sort() when you need an ordered result and reverse() when you only need the present sequence backward."],["code","numbers = [9, 2, 7, 4]\nnumbers.sort()\nprint(numbers)\nnumbers.reverse()\nprint(numbers)"],["h","Sample output"],["out","[2, 4, 7, 9]\n[9, 7, 4, 2]"],["p","These methods return None rather than a new sorted list; call the method on the list, then print or use that list. This differs from operators such as +, which create a combined list when their result is assigned."],["h","Match the operation to the goal"],["p","If the new value belongs at the end, append() is direct. If it belongs at a particular position, insert() shifts later elements to make room. If you know the value to remove, remove() searches for it; if you need the removed value or know its position, pop() is a better fit. Thinking in terms of value versus position helps avoid removing the wrong item."],["h","Choose between replacing and adding"],["p","A short list operation can make the difference between changing an existing element and increasing the collection size. Replacing by index keeps the length the same; append() adds a new final element and increases the length by one. This distinction matters when a position represents a fixed category, such as Monday through Friday, versus an expanding history of new entries."],["code","tasks = [\"plan\", \"draft\"]\ntasks[1] = \"revise\"\ntasks.append(\"submit\")\nprint(tasks)\nprint(len(tasks))"],["h","Sample output"],["out","['plan', 'revise', 'submit']\n3"],["p","The second value was replaced, then a new item was added at the end. The output still has three items because the list began with two, gained one through append(), and retained the same number of elements during the index assignment."],["h","A list variable refers to a mutable object"],["p","Mutability means the list object can be updated after it is created. Assigning to an index, calling append(), or sorting the list changes that object. If a second variable is assigned the same list, both names refer to the same underlying collection, so an update through either name is visible through both. This is different from assigning a new list to one variable, which changes what that name refers to."],["code","original = [\"draft\", \"review\"]\nalias = original\nalias.append(\"publish\")\nprint(original)\nprint(alias)"],["out","['draft', 'review', 'publish']\n['draft', 'review', 'publish']"],["p","The assignment alias = original did not make a second list; it gave the same list another name. To make a separate shallow copy of a list, use copy() or a full slice. A shallow copy has its own outer list, but nested mutable elements are still shared. Use this distinction when you want to experiment with a list while keeping the original collection intact."],["code","original = [\"draft\", \"review\"]\nworking = original.copy()\nworking.append(\"publish\")\nprint(original)\nprint(working)"],["out","['draft', 'review']\n['draft', 'review', 'publish']"],["h","Plan removals and updates"],["p","List methods have different effects and return values. append(), insert(), remove(), clear(), sort(), and reverse() update the existing list and generally return None. pop() is different because it both removes an element and returns that element, which lets a program save or process what it removed. When a value might not be present, test with in before calling remove(); when a list might be empty, check its length before calling pop()."],["code","waiting = [\"Mina\", \"Luis\"]\nif waiting:\n    next_person = waiting.pop(0)\n    print(\"Now helping:\", next_person)\nprint(\"Still waiting:\", waiting)"],["out","Now helping: Mina\nStill waiting: ['Luis']"],["p","Here pop(0) removes the first item and returns it, matching a first-in, first-out queue. Removing from the front of a long list requires Python to shift the remaining elements, so lists are a good simple queue for small examples but specialized queue tools are more efficient for large workloads."],["h","Common mistakes"],["ul",["Using an index assignment to add a new position beyond the current end.","Confusing remove(value), which searches by value, with pop(index), which uses a position.","Trying to remove a value that is not present without checking first."]],["h","Practice"],["p","1. Append \"desk\" to [\"chair\", \"lamp\"], then print the list."],["p","2. Replace the second item in [\"red\", \"green\", \"blue\"] with \"silver\"."],["p","3. Use pop() to remove the last item from a list and store the removed value."]]},"44":{"h":"Lesson 4.4: List Operators","b":[["p","Operators can combine lists, repeat a pattern, or test whether a value is present. The result depends on the operator: + and * create a new list, while in and not in produce True or False. Knowing which operation changes a list and which one only checks it helps prevent unexpected results."],["h","List operators at a glance"],["tbl",[["Operator","Purpose","Example"],["+","Joins two lists in order.","[1, 2] + [3]"],["*","Repeats the list pattern.","[\"go\"] * 3"],["in","Checks for a matching element.","\"tea\" in drinks"],["not in","Checks that no element matches.","\"tea\" not in drinks"],["==","Checks whether two lists have equal values in order.","[1, 2] == [1, 2]"]]],["h","Combine and repeat"],["code","morning = [\"read\", \"plan\"]\nafternoon = [\"code\", \"review\"]\nday = morning + afternoon\nmarks = [\"-\"] * 5\nprint(day)\nprint(marks)"],["h","Sample output"],["out","['read', 'plan', 'code', 'review']\n['-', '-', '-', '-', '-']"],["p","Concatenation places the elements of the second list after the elements of the first and returns a combined list. Repetition makes the stated number of copies of the pattern. Neither expression changes the original list by itself; assigning the result to day or marks stores the new list under that name. Use append() when you want to add a single element to an existing list."],["h","Test membership and equality"],["code","drinks = [\"water\", \"tea\", \"juice\"]\nprint(\"tea\" in drinks)\nprint(\"coffee\" not in drinks)\nprint([1, 2] == [1, 2])"],["h","Sample output"],["out","True\nTrue\nTrue"],["p","Membership checks the list elements for an equal value. Text matching is case-sensitive, so \"Tea\" and \"tea\" are different strings. Equality compares both the values and their order: [1, 2] == [2, 1] is False. A membership test is useful before calling remove() or before choosing a conditional path."],["h","Membership checks complete elements"],["p","For a list of strings, in checks whether one element equals the string on its left. It does not search inside each element for a partial match. This differs from using in with a single string, where Python can check for a substring. When the collection is a list, check the exact element you expect to find."],["code","trees = [\"maple\", \"oak\"]\nprint(\"maple\" in trees)\nprint(\"map\" in trees)\nprint([\"maple\", \"oak\"] == [\"oak\", \"maple\"])"],["h","Sample output"],["out","True\nFalse\nFalse"],["p","The first membership test succeeds because maple is an entire element. The second is False because map is only part of a string in the list. The equality test is also False: both lists contain the same words, but in a different order. For lists, order is part of the comparison."],["h","Decide whether to create or change a list"],["p","An expression such as combined = first + second builds a new list and stores it in combined. The original lists remain available under their own names. By contrast, append() changes the list it is called on. Repetition creates a new list pattern, and multiplying by zero produces an empty list. Choose + when two collections should be joined into a result, and append() when one value should be added to an existing collection."],["h","Operators produce different kinds of results"],["p","When reading a list expression, ask whether it creates a new list, changes an existing list, or produces a Boolean answer. Concatenation with + creates a combined list; repetition with * creates a repeated pattern; in and not in answer a membership question; and == compares the lists element by element. These operators do not all behave alike, even when they appear in similar expressions."],["code","first = [1, 2]\nsecond = [3]\ncombined = first + second\nprint(combined)\nprint(first)\nprint(combined is first)"],["out","[1, 2, 3]\n[1, 2]\nFalse"],["p","The new combined list contains the elements from both inputs, while first remains unchanged. The is operator checks whether two names refer to the exact same object; it is different from ==, which checks whether values are equal. For ordinary list comparisons, use == when you want to compare contents and order."],["h","Repetition and nested mutable values"],["p","Repeating a list of immutable values, such as strings or integers, is straightforward. A subtle issue appears when the repeated element is itself a mutable list: every position may refer to that same inner list. Updating one row can then appear to change every row. Build each inner list separately when each row must be independent."],["code","grid = [[0] * 3] * 2\ngrid[0][0] = 9\nprint(grid)\n\nseparate_rows = [[0] * 3 for _ in range(2)]\nseparate_rows[0][0] = 9\nprint(separate_rows)"],["out","[[9, 0, 0], [9, 0, 0]]\n[[9, 0, 0], [0, 0, 0]]"],["p","The first expression repeats a reference to one inner list, so both displayed rows reflect the same update. The second expression constructs a fresh inner list for each pass. This behavior is an important reminder that a list can contain references to other objects; the brackets show the structure, but they do not guarantee that every nested value is independent."],["h","Compare complete lists"],["p","List equality checks whether the two lists have the same length and equal values in the same order. If one value differs, if one list has an extra element, or if the order changes, the comparison is False. Membership, by contrast, asks whether a single value matches any complete element. These are different questions: use == to compare two collections and in to search one collection for a value."],["h","Common mistakes"],["ul",["Using + between a list and a single value instead of adding a one-element list or using append().","Expecting list repetition to multiply the values themselves; it repeats the sequence.","Assuming membership ignores capitalization or checks only part of a string."]],["h","Practice"],["p","1. Join [\"A\", \"B\"] and [\"C\"] and print the result."],["p","2. Create a list containing four copies of the number 0."],["p","3. Use in to check whether \"maple\" appears in a list of tree names."]]},"45":{"h":"Lesson 4.5: Conditionals in Lists","b":[["p","A conditional can choose what a program does based on a list’s contents. Membership tests with in and not in are especially useful: they turn a question about the list into a Boolean value that an if statement can evaluate. A program can check for a requested item, prevent duplicate entries, or display a message when a value is unavailable."],["h","Check whether a value is present"],["code","pantry = [\"rice\", \"beans\", \"tea\"]\nrequested = \"tea\"\nif requested in pantry:\n    print(\"Available\")\nelse:\n    print(\"Add it to the list\")"],["h","Sample output"],["out","Available"],["p","Python evaluates requested in pantry before choosing a branch. Because tea is one of the elements, the expression is True and the first block runs. If requested were coffee, Python would run the else block. You can use not in to express the missing-item check directly."],["h","Check that a list has values before using an index"],["p","A list may be empty, especially when values come from user input or a file. Attempting to read list[0] when the list has no elements causes an IndexError. An if statement can test the list before reading from it. In Python, a nonempty list is treated as True and an empty list is treated as False in a condition."],["code","scores = []\nif scores:\n    print(\"First score:\", scores[0])\nelse:\n    print(\"No scores have been entered\")"],["h","Sample output"],["out","No scores have been entered"],["h","Compare a selected value"],["p","A conditional can compare an element retrieved by index with a threshold. Make sure the index exists before using it if the list length can vary. When the goal is to check every value, a loop with a conditional is a better fit; that pattern appears in Lesson 4.6. For one known position, combine a length check with the comparison."],["code","scores = [68, 85, 92]\nif len(scores) > 1 and scores[1] >= 70:\n    print(\"Second score passes\")\nelse:\n    print(\"No passing second score\")"],["h","Sample output"],["out","Second score passes"],["h","Use short-circuit checks to protect an index"],["p","The and operator evaluates its left condition first and checks the right side only if the left side is True. This short-circuit behavior can guard an index access: first confirm the list is not empty, then inspect its first element. If the list is empty, Python skips the indexing expression, so no IndexError occurs."],["code","queue = []\nif queue and queue[0] == \"urgent\":\n    print(\"Handle this first\")\nelse:\n    print(\"Queue is empty or has no urgent item\")"],["h","Sample output"],["out","Queue is empty or has no urgent item"],["p","For a nonempty queue, Python continues to the second check and compares the first value with urgent. For an empty queue, the first part is False and the second part is not evaluated. This is a compact way to combine a safety check with a condition about a particular element."],["h","Separate list checks from value comparisons"],["p","Membership answers whether a value is present anywhere in the list. An indexed comparison answers whether the value at one specific position meets a rule. A length check answers how many elements there are. Choose the condition that matches the question: use value in list for presence, len(list) &gt;= limit for size, and list[index] &gt;= limit for a value at a known position."],["h","Prevent a duplicate entry"],["p","A membership test can decide whether an update is needed. For example, an application that saves favorite colors can check whether the selected color is already present before appending it. The condition keeps the list from collecting the same choice twice when duplicates are not useful."],["code","favorites = [\"blue\", \"green\"]\nchoice = \"blue\"\nif choice not in favorites:\n    favorites.append(choice)\nelse:\n    print(choice, \"is already saved\")\nprint(favorites)"],["h","Sample output"],["out","blue is already saved\n['blue', 'green']"],["p","The not in expression is False because blue already appears in favorites, so Python runs the else branch and leaves the list unchanged. If choice were gold, Python would append it instead."],["h","Choose a condition that matches the question"],["p","List conditions can ask about presence, size, contents, or a particular position. Use value in items to ask whether a matching element is present. Use len(items) to compare the number of elements with a required size. Use items[index] only when you mean a specific position and have checked that it exists. Being precise about the question prevents a condition from appearing to work while checking the wrong part of the data."],["code","temperatures = [18, 22, 19]\nif 22 in temperatures:\n    print(\"The reading 22 was recorded\")\nif len(temperatures) >= 3:\n    print(\"There are at least three readings\")"],["out","The reading 22 was recorded\nThere are at least three readings"],["h","A list can be used directly as a condition"],["p","Python treats an empty list as False and a nonempty list as True. This makes if items: a concise way to check that there is at least one element before using the collection. It does not tell you how many elements there are or whether a particular value appears; use len() or in when those are the actual questions. The direct truth-value check is especially useful before selecting the first item or calculating an average."],["code","readings = [18, 22, 19]\nif readings:\n    average = sum(readings) / len(readings)\n    print(\"Average:\", average)\nelse:\n    print(\"No readings to average\")"],["out","Average: 19.666666666666668"],["p","The condition protects the division by len(readings), because an empty list would make the denominator zero. For a polished report, a program can round the result for display, but the underlying calculation remains a number. A check for list contents and a check for a numeric threshold are separate decisions; use both when the program needs to ensure data exists and then evaluate its values."],["h","Ask whether any or all elements meet a rule"],["p","Python provides any() and all() for common questions about a group of conditions. any() is True when at least one element in its input is truthy; all() is True when every element is truthy. With a generator expression, they can evaluate a rule for each value without building a second list. In beginner code, an explicit loop may be easier to trace, but these functions are useful once the pattern is familiar."],["code","scores = [72, 55, 94]\nany_passing = any(score >= 70 for score in scores)\nall_passing = all(score >= 70 for score in scores)\nprint(any_passing)\nprint(all_passing)"],["out","True\nFalse"],["p","At least one score meets the threshold, so any_passing is True. Not every score meets it, so all_passing is False. For an empty input, any() returns False and all() returns True; if that result would be misleading in a program, check that the list is nonempty first."],["h","Common mistakes"],["ul",["Using = to assign a value where == is needed to compare two values.","Checking a list element before confirming that its index exists.","Using membership when you mean to compare an element with a threshold."]],["h","Practice"],["p","1. Print a message if \"notebook\" is in a supplies list."],["p","2. Write an if/else that reports whether a list is empty."],["p","3. Check whether the first value in a list is greater than 10, safely handling an empty list."]]},"46":{"h":"Lesson 4.6: Loops in Lists","b":[["p","A loop can visit each element in a list so the program can display, count, or calculate with the entire collection. A for loop is usually the simplest choice when the task applies to every value. Python assigns each next element to the loop variable, so a separate index is not needed for ordinary element-by-element work."],["h","Process each element directly"],["code","supplies = [\"pen\", \"book\", \"lamp\"]\nfor item in supplies:\n    print(\"Pack:\", item)"],["h","Sample output"],["out","Pack: pen\nPack: book\nPack: lamp"],["p","The loop body runs once for each element. During the first pass item is pen, then it becomes book, then lamp. The list remains unchanged because the code only reads and prints its values. Direct iteration is clear when the program needs the element itself rather than its position."],["h","Use a running total and a condition"],["p","Lists become more useful when combined with the arithmetic and conditional patterns from earlier chapters. A running total can collect values, while an if statement can count only the elements that meet a rule. Start each total or counter at zero before the loop; update it inside the loop so it changes once for each relevant value."],["code","scores = [72, 55, 94, 68]\ntotal = 0\npassing = 0\nfor score in scores:\n    total = total + score\n    if score >= 70:\n        passing = passing + 1\nprint(\"Total:\", total)\nprint(\"Passing:\", passing)"],["h","Sample output"],["out","Total: 289\nPassing: 2"],["p","The total includes all four scores. The passing counter changes only when score &gt;= 70 is True, so 72 and 94 contribute to that count. If you also need the average, divide total by len(scores), but check that the list is not empty before dividing."],["h","When an index is useful"],["p","Sometimes a program needs both an element and its position. A for loop can visit index values from range(len(list)), then use each index to retrieve the matching element. Use this pattern sparingly: direct iteration is easier to read when position does not matter. If a while loop is used to walk through a list, remember to increase the index on every pass and keep it within the list’s bounds."],["code","names = [\"Maya\", \"Luis\", \"Ari\"]\nfor index in range(len(names)):\n    print(index, names[index])"],["h","Sample output"],["out","0 Maya\n1 Luis\n2 Ari"],["h","Build a smaller list from a condition"],["p","A loop can create a new list containing only elements that pass a condition. Start with an empty result list, visit each value in the original list, and append a value only when the condition is True. This pattern is called filtering: the source list stays intact, while the new list contains the selected elements."],["code","scores = [72, 55, 94, 68]\npassing_scores = []\nfor score in scores:\n    if score >= 70:\n        passing_scores.append(score)\nprint(passing_scores)"],["h","Sample output"],["out","[72, 94]"],["p","The loop visits all four scores. The conditional accepts 72 and 94, while 55 and 68 do not meet the threshold. append() adds each accepted value to passing_scores. Keeping the original scores and the filtered result in separate lists is useful when a program needs both the full data and a selected group."],["h","Choose direct iteration or index-based iteration"],["p","Direct iteration, for item in items, is usually best when the program needs each value. Use an index-based loop when the position is part of the task, for example when displaying numbered entries or replacing a value at a known position. If the program only needs to read each element, avoiding manual index updates reduces off-by-one errors."],["h","What happens during each pass"],["p","A for loop asks the list for its next element and assigns that value to the loop variable. The indented body then runs once for that value. After the body finishes, Python moves to the next element; after the final element, the loop ends. This makes direct iteration a natural way to process every element without calculating indexes or deciding when to stop. An empty list provides no values, so the body runs zero times."],["code","for color in [\"blue\", \"gold\"]:\n    print(\"Current value:\", color)\nprint(\"Loop finished\")"],["out","Current value: blue\nCurrent value: gold\nLoop finished"],["p","The final print() is not indented, so it runs once after the loop rather than once for each color. Indentation therefore communicates which instructions repeat. When tracing a loop, write down the loop variable’s value on each pass and update totals or counters only where the code is indented inside the loop."],["h","Keep track of positions with enumerate()"],["p","When a task needs both each value and its position, enumerate() provides them together. By default, its count begins at zero, matching list indexes. You can supply start=1 when you want human-facing numbering while still retrieving values in order. This is often clearer than looping over range(len(items)) and indexing the list manually."],["code","names = [\"Maya\", \"Luis\", \"Ari\"]\nfor number, name in enumerate(names, start=1):\n    print(number, name)"],["out","1 Maya\n2 Luis\n3 Ari"],["p","The number variable is a display count beginning at 1, while enumerate() still visits the first, second, and third list elements in order. If the program needs the actual zero-based index, omit start=1. Use the value yielded by the loop directly whenever a separate position is unnecessary."],["h","Avoid changing the list being traversed"],["p","Adding or removing elements from a list while looping over that same list can make the traversal confusing. A removal shifts later elements left, and the loop may advance past a value that has not yet been checked. A safer pattern is to build a new list with the elements you want to keep, as in the filtering example earlier in this lesson, or to iterate over a copy when in-place changes are required."],["code","numbers = [3, 8, 5, 10]\nkept = []\nfor number in numbers:\n    if number >= 6:\n        kept.append(number)\nprint(numbers)\nprint(kept)"],["out","[3, 8, 5, 10]\n[8, 10]"],["p","The original list remains available, and kept contains only the values that passed the condition. This approach is easy to inspect because the loop reads one collection and writes to another. When you are learning, keeping input data and results separate also makes it easier to compare expected and actual behavior."],["h","Select a loop for the job"],["p","Use a for loop when the program should visit each element or a known sequence of positions. A while loop is useful when repetition depends on a condition that changes during processing, such as continuing until a sentinel value is reached; if it is used to visit list indexes, initialize the index, check its boundary, and increment it on every pass. For simple element-by-element work, for item in items is shorter and avoids manual index errors."],["h","Common mistakes"],["ul",["Forgetting to indent the repeated work inside the loop.","Changing a running total or counter outside the loop when it should update each pass.","Using an index that can move beyond the list length."]],["h","Practice"],["p","1. Use a for loop to print each value in a list of three favorite foods."],["p","2. Count how many values in [3, 12, 7, 20] are greater than 10."],["p","3. Use a running total to add every value in a list of prices."]]},"49":{"h":"Chapter 4 Review","b":[["p","A list keeps ordered values together under one name. Indexes start at 0, negative indexes count from the end, and slices select a range whose stop position is excluded. Lists are mutable: assign to an existing index to replace an element, or use methods such as append(), insert(), remove(), and pop() to change the collection. The operators + and * combine or repeat lists; in and not in test membership. A conditional can check list contents or protect an index access, and a loop can apply the same work to every element."],["h","Review the list tools"],["tbl",[["Need","Useful pattern","What to check"],["Read one value","items[index]","Index is within range"],["Read a range","items[start:stop]","Stop is excluded"],["Add or remove","append(), insert(), remove(), pop()","Whether the operation uses a value or position"],["Check contents","value in items","Membership is exact and case-sensitive for text"],["Process all values","for item in items:","Indent repeated work inside the loop"]]],["h","Putting the ideas together"],["p","This example adds a score, checks whether a particular score is present, and then calculates a total and passing count. The for loop examines each value, while the conditional decides whether that value contributes to the passing count."],["code","scores = [72, 84, 96]\nscores.append(88)\nprint(\"Has 84:\", 84 in scores)\ntotal = 0\npassing = 0\nfor score in scores:\n    total = total + score\n    if score >= 80:\n        passing = passing + 1\naverage = total / len(scores)\nprint(\"Scores:\", scores)\nprint(\"Average:\", average)\nprint(\"Passing:\", passing)"],["h","Sample output"],["out","Has 84: True\nScores: [72, 84, 96, 88]\nAverage: 85.0\nPassing: 3"],["p","The list now contains four scores because append() added one value. The membership expression checks for 84 and returns True. The loop adds each score to total and increments passing only for values of at least 80. Since the list has four values, the average is total divided by four. When a result is unexpected, trace the list order, verify each index, and follow the loop variable and any condition one pass at a time."]]},"50":{"h":"Chapter 5: Tuples","b":[["p","A tuple is an ordered collection of values that cannot be changed after it is created. Tuples are useful when a group of values belongs together and should remain fixed, such as a point on a map, a date, or a record returned by a function. This chapter explains tuple syntax, access, immutability, comparisons, conditionals, and loops, then compares tuples with lists so you can choose the right structure."],["h","Learning goals"],["ul",["Create tuples, recognize their syntax, and explain why commas matter.","Read tuple items with indexes and slices and unpack values into variables.","Explain what immutability means and distinguish it from reassigning a variable.","Choose between tuples and lists for a particular kind of data.","Use membership tests, comparisons, conditionals, and loops with tuples."]],["h","Key terms"],["tbl",[["Term","Meaning"],["Tuple","An ordered, immutable collection of values."],["Immutable","Not changeable after the object is created."],["Index","An integer position used to access an item."],["Slice","A selected range of items from a sequence."],["Unpacking","Assigning tuple items to separate variables."]]]]},"51":{"h":"Lesson 5.1: Intro to Tuples","b":[["p","A tuple stores several values as one ordered sequence. “Ordered” means each item has a position, beginning at index 0, and that position stays associated with the item. Tuples can hold values of different types, although a tuple is often most useful when its items describe related parts of one fixed record."],["h","Create tuples with commas"],["code","point = (3, 7)\nstudent = (\"Maya\", 8, True)\nprint(point)\nprint(type(student))"],["out","(3, 7)\n<class 'tuple'>"],["p","Parentheses make tuple values easy to recognize, but the commas are what define the tuple. This matters most when a tuple has one item: (5) is just the integer 5 inside parentheses, while (5,) is a one-item tuple. An empty tuple can be written as () or created with tuple()."],["code","single_value = (5)\nsingle_tuple = (5,)\nempty_tuple = ()\nprint(type(single_value))\nprint(type(single_tuple))\nprint(len(empty_tuple))"],["out","<class 'int'>\n<class 'tuple'>\n0"],["h","Pack related values together"],["p","Writing multiple comma-separated values assigns them together as a tuple, even if the parentheses are omitted. This is called packing. Parentheses are still recommended in beginner code because they show clearly that the values form one tuple. A tuple can contain strings, numbers, Boolean values, and other collections."],["code","location = \"North\", 42.3, -71.1\nprint(location)\nprint(type(location))"],["out","('North', 42.3, -71.1)\n<class 'tuple'>"],["p","Use tuples when the values belong together and the group should keep a fixed structure. A coordinate pair always has two positions; a color represented by red, green, and blue has three. If the number of items is meant to grow or shrink as a program runs, a list may be a better fit. Tuples are not automatically “better” or safer in every situation; their fixed nature is useful when it matches the meaning of the data."],["h","Let a tuple represent one clear idea"],["p","A tuple is easiest to understand when its positions have a consistent meaning. For example, a point can use the first number for horiz
