 response, len() counts items, and math.sqrt() calculates a square root. Each of these is a function that someone wrote so that programmers could reuse it. In this lesson you will write your own."],["p","A function definition begins with the word def, followed by the function’s name, a pair of parentheses, and a colon. The instructions that belong to the function are indented beneath that line. This indented group is the function’s body, and it follows the same indentation rule you used for if statements and loops."],["h","Why write functions?"],["p","A program often needs to do the same job in several places, such as displaying a divider line or printing a standard greeting. Copying the same instructions into each place is slow, and it makes mistakes more likely: if the wording needs to change, every copy must be found and edited. A function keeps the instructions in one place. The rest of the program uses the function’s name, which also describes the job in plain language and makes the program easier to read."],["h","Example: define and call a function"],["p","The first three lines of this example define a function named show_welcome. The last two lines call it."],["code","def show_welcome():\n    print(\"Welcome to the program\")\n    print(\"Let's get started\")\n\nshow_welcome()\nshow_welcome()"],["h","Sample output"],["out","Welcome to the program\nLet's get started\nWelcome to the program\nLet's get started"],["p","Python reads the def block and remembers the function under the name show_welcome, but it does not run the body yet. Each line such as show_welcome() is a call: Python jumps into the function, runs every indented instruction, and then returns to the line after the call. Because the program calls the function twice, the two messages appear twice."],["h","Define first, then call"],["p","A def statement only creates the function. Nothing inside it runs until a call appears, and the call must come after the definition has been read. In this example, the instruction that prints Middle runs before the function is called, so its output appears before the function’s output."],["code","print(\"Start\")\n\ndef say_done():\n    print(\"Finished\")\n\nprint(\"Middle\")\nsay_done()"],["h","Sample output"],["out","Start\nMiddle\nFinished"],["p","The definition does not print anything. Finished appears only when say_done() is called on the last line. If the call came before the def statement, Python would not yet know the name and would report a NameError."],["h","Worked example: a short report"],["p","A function can remove repeated instructions from a program. Here, print_divider() draws the same line between each part of a report. Changing the character or the length in one place changes every divider in the output."],["code","def print_divider():\n    print(\"-\" * 20)\n\nprint(\"Daily report\")\nprint_divider()\nprint(\"Sales: 14\")\nprint_divider()\nprint(\"Returns: 2\")\nprint_divider()"],["h","Sample output"],["out","Daily report\n--------------------\nSales: 14\n--------------------\nReturns: 2\n--------------------"],["p","The function uses the string repetition you learned in Lesson 1.6. The three calls produce three identical lines. Notice how the main part of the program now reads like a list of steps: print a heading, draw a divider, print a value. The details of drawing a divider live inside the function, so a reader can understand the report without studying them."],["h","Name a function for the job it does"],["p","A function name follows the same rules as a variable name: letters, numbers, and underscores, not beginning with a number, with uppercase and lowercase letters treated as different. Use lowercase words separated by underscores. Because a function performs an action, a name that begins with a verb, such as show_welcome, print_divider, or calculate_total, makes each call easy to understand. Avoid reusing the names of Python’s own functions, such as print or len, because your definition would replace them in your program."],["h","Follow the flow of a call"],["p","When Python reaches a call, it pauses the current line, runs the function body from top to bottom, and then continues where it left off. A function can contain any instructions you already know, including variables, conditions, and loops. It can even call other functions. Tracing a program means following this jump into the function and back out again, writing down what is displayed along the way."],["h","Remember"],["ul",["Write def, the function name, parentheses, and a colon, then indent the body.","Defining a function does not run it; calling it does.","A call needs parentheses, even when the function has nothing to receive."]],["h","Common mistakes"],["ul",["Writing show_welcome without parentheses, which names the function but does not run it.","Forgetting the colon at the end of the def line or the indentation of the body.","Calling a function before the def statement that creates it has run.","Placing an instruction at the left margin when it should belong to the function body."]],["h","Practice"],["p","1. Define a function named show_name that prints your name, then call it twice."],["p","2. Write a function named print_banner that prints a row of 15 equal signs, and use it above and below a one-line message."],["p","3. Predict the output of a program that prints Start, defines a function that prints Inside, prints End, and then calls the function. Explain the order."]]},"82":{"h":"Lesson 8.2: Parameters and Arguments","b":[["p","A function that always does exactly the same thing is limited. Parameters let a function receive information each time it is called, so one definition can work with different values. A parameter is a variable name written inside the parentheses of the definition. An argument is the actual value placed inside the parentheses of a call. When the function runs, Python assigns each argument to the matching parameter."],["h","Example: greet a person"],["code","def greet(name):\n    print(\"Hello,\", name)\n\ngreet(\"Maya\")\ngreet(\"Luis\")"],["h","Sample output"],["out","Hello, Maya\nHello, Luis"],["p","The parameter name is a new variable that exists while the function runs. The first call gives it the value Maya, so the function prints a greeting for Maya. The second call gives it Luis. The function body is written once, but the output depends on the argument."],["tbl",[["Term","Where it appears","Example"],["Parameter","In the def line","def greet(name):"],["Argument","In the call","greet(\"Maya\")"]]],["h","Use more than one parameter"],["p","Separate several parameters with commas. When the function is called, Python matches arguments to parameters by position: the first argument goes to the first parameter, the second argument to the second parameter, and so on. The number of arguments must match the number of parameters, or Python reports an error."],["code","def describe_pet(animal, pet_name):\n    print(pet_name, \"is a\", animal)\n\ndescribe_pet(\"dog\", \"Biscuit\")\ndescribe_pet(\"cat\", \"Mochi\")"],["h","Sample output"],["out","Biscuit is a dog\nMochi is a cat"],["p","If the arguments were swapped, describe_pet(\"Biscuit\", \"dog\") would run without an error and print dog is a Biscuit. Python cannot know which order you meant, so the positions you choose are part of the function’s meaning. Descriptive parameter names, such as animal and pet_name, help readers remember what each position is for."],["h","Worked example: collect values and call a function"],["p","Arguments can come from variables, expressions, or input() responses. This function displays the cost of a purchase. The program converts each typed response to the right type before it calls the function, as you learned in Lesson 1.4."],["code","def show_total(item, price, quantity):\n    total = price * quantity\n    print(item, \"x\", quantity, \"=\", total)\n\nitem_name = input(\"Item: \")\nunit_price = float(input(\"Price each: \"))\ncount = int(input(\"How many? \"))\nshow_total(item_name, unit_price, count)","Notebook;2.5;4"],["h","Sample run"],["out","Item: Notebook\nPrice each: 2.5\nHow many? 4\nNotebook x 4 = 10.0"],["p","The names in the call do not have to match the parameter names. The value of item_name is assigned to item, unit_price to price, and count to quantity, because of their positions. Inside the function, the parameters are used like any other variables. This is why a function can be reused with arguments from many different places in a program."],["h","Parameters belong to the function"],["p","A parameter is a local name: it exists only while the function is running. Assigning a new number to a parameter changes that name inside the function, but it does not change the variable that supplied the argument."],["code","def add_bonus(score):\n    score = score + 5\n    print(\"Inside:\", score)\n\npoints = 80\nadd_bonus(points)\nprint(\"Outside:\", points)"],["h","Sample output"],["out","Inside: 85\nOutside: 80"],["p","The call add_bonus(points) gives the parameter score the value 80. The function adds 5 to its own name and displays 85. The variable points still holds 80 afterward. If a function needs to give a new value back to the caller, it should return the value, which is the topic of the next lesson."],["h","Match the call to the definition"],["p","Before calling a function, check three things: the name is spelled the same way as in the definition, the number of arguments matches the number of parameters, and the arguments are in the order the parameters expect. If a call supplies too few or too many arguments, Python raises a TypeError that reports the mismatch. Reading the def line is the quickest way to confirm what a function expects."],["h","Common mistakes"],["ul",["Supplying a different number of arguments than the function has parameters.","Passing arguments in the wrong order, which can run without an error but produce a wrong result.","Expecting a call to change the caller’s variable when the function only assigns a new value to its parameter.","Forgetting to convert an input() response before passing it to a function that calculates with numbers."]],["h","Practice"],["p","1. Write a function named show_square that takes a number and prints its square. Call it with 6 and with 9."],["p","2. Write a function named introduce that takes a name and a hobby and prints a sentence using both. Call it twice with different values."],["p","3. Explain why changing a parameter inside a function does not change the variable used in the call."]]},"83":{"h":"Lesson 8.3: Returning Values","b":[["p","So far, the functions in this chapter have displayed results with print(). A function can also send a value back to the code that called it. The return statement ends the function and supplies a return value, which the caller can store in a variable, use in a calculation, or display. Returning values makes functions flexible, because the caller decides what to do with the result."],["h","Example: return a sum"],["code","def add(first, second):\n    return first + second\n\ntotal = add(8, 5)\nprint(total)\nprint(add(2, 3) * 10)"],["h","Sample output"],["out","13\n50"],["p","The call add(8, 5) is replaced by the value it returns, so total receives 13. The second print() uses a call inside a larger expression: add(2, 3) becomes 5, and then 5 is multiplied by 10. A call that returns a value can appear anywhere a value of that type could appear."],["h","Returning is different from printing"],["p","print() displays text for a person to read, but it does not give a value to the program. A function that only prints has nothing useful to return, so Python gives back the special value None. Compare these two functions."],["code","def show_double(number):\n    print(number * 2)\n\ndef get_double(number):\n    return number * 2\n\nshown = show_double(4)\nkept = get_double(4)\nprint(\"shown is\", shown)\nprint(\"kept is\", kept)"],["h","Sample output"],["out","8\nshown is None\nkept is 8"],["p","Both functions calculate 8, but only get_double hands the value back. The first call displays 8 as a side effect and then leaves shown set to None. The second call produces no output on its own; the program prints kept afterward. Use return when later code needs the result, and use print() when the goal is simply to display something."],["h","A return ends the function"],["p","As soon as Python runs a return statement, the function stops and any later instructions in its body are skipped. This allows a function to return early. In the example, each if statement returns a label as soon as a condition is met, so the function never reaches the lines below it."],["code","def grade_label(score):\n    if score >= 90:\n        return \"A\"\n    if score >= 80:\n        return \"B\"\n    return \"Keep practicing\"\n\nfor score in [95, 84, 61]:\n    print(score, grade_label(score))"],["h","Sample output"],["out","95 A\n84 B\n61 Keep practicing"],["p","A score of 95 returns A on the first test and never checks the others. A score of 61 fails both tests and reaches the final return. Every path through the function ends with a return, which means the caller always receives a value. If a path ended without one, the caller would receive None."],["h","Worked example: calculate and reuse a result"],["p","A function that returns a value can be used with input from the person running the program. Here, calculate_total() returns the price including tax. The calling code stores the result and decides how to display it. The round() function limits the result to two decimal places."],["code","def calculate_total(price, tax_rate):\n    return round(price * (1 + tax_rate), 2)\n\nprice = float(input(\"Price: \"))\ntotal = calculate_total(price, 0.08)\nprint(\"Total with tax:\", total)","12.5"],["h","Sample run"],["out","Price: 12.5\nTotal with tax: 13.5"],["p","The function is concerned only with the calculation. It does not ask for input and it does not print, so the same function could be reused in a program that reads prices from a list. Keeping calculation, input, and output separate is a habit that makes functions easier to test and reuse."],["h","Return more than one value"],["p","A return statement can send back several values separated by commas. Python packs them into a tuple, as you saw in Chapter 5, and the caller can unpack the tuple into separate variables. This is helpful when one calculation produces related results, such as the number of full groups and the number left over."],["code","def divide_with_remainder(total, group_size):\n    return total // group_size, total % group_size\n\nfull_bags, leftover = divide_with_remainder(17, 5)\nprint(\"Full bags:\", full_bags)\nprint(\"Apples left:\", leftover)"],["h","Sample output"],["out","Full bags: 3\nApples left: 2"],["p","This turns the packing example from Lesson 1.5 into a reusable function. The call returns the tuple (3, 2), and the two names on the left receive its values in order. The number of names must match the number of returned values."],["h","Common mistakes"],["ul",["Using print() when the program needs a value it can store or calculate with.","Expecting a value from a function that has no return statement; the result is None.","Placing instructions after a return and expecting them to run.","Forgetting to store or use the returned value, so the result is lost."]],["h","Practice"],["p","1. Write a function named triple that returns a number multiplied by 3. Print the result of triple(7)."],["p","2. Write a function named is_even that returns True when a number is even and False when it is odd. Test it with 10 and 7."],["p","3. Write a function that returns both the smaller and the larger of two numbers, then unpack the results into two variables."]]},"84":{"h":"Lesson 8.4: Default and Keyword Arguments","b":[["p","Some arguments are required every time, while others have a sensible value most of the time. A default value lets a parameter be optional. Write the parameter name, an equals sign, and the default value in the def line. If a call supplies an argument for that parameter, Python uses it; if the call leaves it out, Python uses the default."],["h","Example: an optional greeting"],["code","def greet(name, greeting=\"Hello\"):\n    print(greeting + \", \" + name + \"!\")\n\ngreet(\"Maya\")\ngreet(\"Luis\", \"Good morning\")"],["h","Sample output"],["out","Hello, Maya!\nGood morning, Luis!"],["p","The first call provides only the required argument, so greeting uses its default value, Hello. The second call supplies both arguments, and the new value replaces the default for that call only. The default does not change the function permanently."],["h","Order of required and default parameters"],["p","Parameters without defaults must come before parameters with defaults in the def line. Python matches positional arguments from left to right, and a required parameter that appeared after an optional one would make that matching ambiguous. A definition such as def greet(greeting=\"Hello\", name): is therefore not allowed. List the required parameters first, then the optional ones."],["h","Keyword arguments"],["p","A call can name the parameter that each argument belongs to by writing name=value. These are called keyword arguments. Because Python can match each value by name, the order of keyword arguments does not matter. Keyword arguments also make a call easier to read when the meaning of a value is not obvious from its position."],["code","def total_cost(price, quantity=1, tax_rate=0.08):\n    return round(price * quantity * (1 + tax_rate), 2)\n\nprint(total_cost(12))\nprint(total_cost(12, 3))\nprint(total_cost(12, tax_rate=0.05))\nprint(total_cost(quantity=2, price=12, tax_rate=0))"],["h","Sample output"],["out","12.96\n38.88\n12.6\n24"],["p","The first call uses both defaults. The second supplies a quantity by position and still uses the default tax rate. The third skips quantity and changes only tax_rate by naming it. The last call names all three values, so their order in the call does not matter. When called with a price of 12 and a quantity of 3, this function reproduces the 38.88 total from Lesson 1.5."],["h","Mix positional and keyword arguments carefully"],["p","When a call uses both forms, the positional arguments must come first. After a keyword argument appears, every remaining argument must also be a keyword argument. Do not give the same parameter a value twice: total_cost(12, price=10) tries to assign price both by position and by name, and Python raises a TypeError. A misspelled keyword, such as quantiy=3, is also an error because the function has no parameter with that name."],["h","Worked example: a flexible title"],["p","Defaults are useful for formatting options. The function below prints a title between two border lines, with an optional border character and an optional width."],["code","def print_title(text, symbol=\"*\", width=20):\n    print(symbol * width)\n    print(text)\n    print(symbol * width)\n\nprint_title(\"Report\")\nprint_title(\"Summary\", symbol=\"=\", width=12)"],["h","Sample output"],["out","********************\nReport\n********************\n============\nSummary\n============"],["p","The first call uses the default border. The second keeps the text positional and replaces the other two settings with keyword arguments. The call reads clearly even if you do not remember the order of the parameters. Because symbol and width have defaults, a program can add new calls that rely on the standard look without repeating those details."],["h","Choose simple default values"],["p","A default should represent the usual choice: 1 for a quantity, 0 for an optional discount, an empty string for optional text, or None to mean that nothing was supplied. Numbers, strings, Booleans, and None are safe defaults because they cannot be changed in place. Lesson 8.7 explains why a list or a dictionary should not be used as a default value."],["h","Common mistakes"],["ul",["Placing a parameter without a default after a parameter that has one.","Writing a keyword argument before a positional argument in a call.","Giving the same parameter a value both by position and by name.","Misspelling a keyword name, which Python reports as an unexpected keyword argument."]],["h","Practice"],["p","1. Write a function greet_user(name, greeting=\"Welcome\") that prints a greeting. Call it with and without the second argument."],["p","2. Write a function area(width, height=1) that returns width * height. Call it with one argument and with two."],["p","3. Call total_cost from this lesson using only keyword arguments, in an order different from the definition."]]},"85":{"h":"Lesson 8.5: Variable Scope","b":[["p","A variable name does not exist everywhere in a program. Scope is the part of a program where a name can be used. A variable created inside a function, including its parameters, is a local variable: it exists only while that function runs and cannot be used outside it. A variable created outside every function is a global variable and is available to the whole program."],["h","Local variables"],["code","def make_message():\n    message = \"Inside the function\"\n    print(message)\n\nmake_message()\nprint(\"Finished\")"],["h","Sample output"],["out","Inside the function\nFinished"],["p","The variable message is created when make_message() runs and disappears when the function ends. If the program tried to print message after the call, Python would raise a NameError because the name does not exist at that level. Local variables keep a function’s working values private, so different parts of a program do not interfere with one another."],["h","Each call has its own local variables"],["code","def count_up(limit):\n    total = 0\n    for number in range(1, limit + 1):\n        total = total + number\n    return total\n\nprint(count_up(3))\nprint(count_up(4))"],["h","Sample output"],["out","6\n10"],["p","The name total appears in the function, but every call starts with a fresh variable set to 0. The second call does not inherit the 6 from the first. This is why a function can be called repeatedly and still give predictable results."],["tbl",[["Kind of name","Where it is created","Where it can be used"],["Local variable","Inside a function, including its parameters","Only inside that function, while it runs"],["Global variable","Outside every function","Throughout the program; a function can read it"]]],["h","Reading a global variable"],["p","A function can read a global variable as long as it does not assign to a local variable with the same name. This is acceptable for settings that stay fixed, such as a tax rate. Programmers often write the names of fixed values in uppercase to show that the program should not change them. A function that depends on a global value is harder to reuse, because its result depends on something that is not in its parameters."],["code","TAX_RATE = 0.08\n\ndef add_tax(price):\n    return round(price * (1 + TAX_RATE), 2)\n\nprint(add_tax(50))"],["h","Sample output"],["out","54.0"],["h","Assigning inside a function creates a local name"],["code","count = 10\n\ndef change_count():\n    count = 99\n    print(\"Inside:\", count)\n\nchange_count()\nprint(\"Outside:\", count)"],["h","Sample output"],["out","Inside: 99\nOutside: 10"],["p","The assignment count = 99 inside the function does not change the global count. Python treats a name that is assigned inside a function as local, so the function creates a separate variable that happens to share the name. The global value stays 10. Using one name for two different variables is allowed, but it can confuse readers, so choose distinct names when both are present."],["h","Pass values in and return values out"],["p","Python has a global statement that lets a function assign to a global variable, but beginners should usually avoid it. A clearer pattern is to pass the current value into the function as an argument and return the new value. The caller then decides whether to store it."],["code","def add_point(score):\n    return score + 1\n\nscore = 5\nscore = add_point(score)\nscore = add_point(score)\nprint(\"Score:\", score)"],["h","Sample output"],["out","Score: 7"],["p","Each call receives the current score and returns a new one. The assignment on the left of the call stores the result. Because everything the function uses arrives through its parameters and everything it produces leaves through return, the function can be tested on its own, without worrying about what else is in the program."],["h","Common mistakes"],["ul",["Trying to use a local variable outside the function that created it.","Assuming that assigning to a name inside a function changes a global variable with the same name.","Relying on a global value that the function does not receive as an argument.","Reusing one name for unrelated variables, which makes scope harder to follow."]],["h","Practice"],["p","1. Write a function that creates a local variable and prints it. Explain why the same name cannot be printed after the function ends."],["p","2. Predict the output of a program that sets x to 3, defines a function that assigns 8 to x and prints it, calls the function, and then prints x. Explain both numbers."],["p","3. Rewrite a function that depends on a global tax rate so that the rate is a parameter with a default value."]]},"86":{"h":"Lesson 8.6: Functions with Collections and Control Flow","b":[["p","Functions become much more useful when they work with the lists, tuples, and dictionaries from earlier chapters. A collection can be passed as an argument like any other value, and a function can use loops and conditionals to process it. The function packages a pattern you already know, such as totaling values, counting matches, or building a filtered list, so that you can apply it to any collection."],["h","Process a list with a loop"],["code","def total_price(prices):\n    total = 0\n    for price in prices:\n        total = total + price\n    return total\n\ncart = [4.5, 12.0, 3.25]\nprint(\"Cart total:\", total_price(cart))\nprint(\"Empty total:\", total_price([]))"],["h","Sample output"],["out","Cart total: 19.75\nEmpty total: 0"],["p","The function starts a running total at 0, adds each price, and returns the result after the loop. Because the total begins at 0, an empty list produces 0 without any special handling. The list is the argument, so the same function works for any cart. Notice that the return statement is outside the loop; placing it inside would end the function after the first price."],["h","Check before calculating"],["p","Some calculations are not meaningful for an empty list. An average divides by the number of items, and dividing by zero causes an error. A conditional at the start of the function can decide what to return when there is no data. Returning None is a clear signal that no average exists."],["code","def average(scores):\n    if not scores:\n        return None\n    return sum(scores) / len(scores)\n\nprint(average([72, 84, 90, 94]))\nprint(average([]))"],["h","Sample output"],["out","85.0\nNone"],["p","The condition not scores is True when the list is empty, as you saw in Lesson 4.5. The function returns early in that case, so the division is never attempted. The caller can test the result with a conditional before using it."],["h","Build and return a new list"],["code","def passing_scores(scores, minimum=70):\n    result = []\n    for score in scores:\n        if score >= minimum:\n            result.append(score)\n    return result\n\nall_scores = [72, 55, 94, 68]\nprint(passing_scores(all_scores))\nprint(passing_scores(all_scores, 90))\nprint(all_scores)"],["h","Sample output"],["out","[72, 94]\n[94]\n[72, 55, 94, 68]"],["p","This is the filtering pattern from Lesson 4.6 inside a function. The function creates its own empty list, appends the scores that meet the minimum, and returns it. The original list is not changed, as the last line confirms. The default minimum makes the common call short, while a second argument adjusts the rule."],["h","Use a dictionary argument"],["code","def describe_student(record):\n    name = record.get(\"name\", \"Unknown\")\n    score = record.get(\"score\", 0)\n    return name + \" scored \" + str(score)\n\nprint(describe_student({\"name\": \"Maya\", \"score\": 88}))\nprint(describe_student({\"name\": \"Luis\"}))"],["h","Sample output"],["out","Maya scored 88\nLuis scored 0"],["p","The function uses get() from Lesson 6.2 so that a missing key does not stop the program. The keys tell the function which value is which, so it does not depend on the order of the information. When a function needs every entry, it can loop over the dictionary with items(), as in Lesson 6.6."],["code","def count_high(scores_by_name, cutoff):\n    count = 0\n    for name, score in scores_by_name.items():\n        if score >= cutoff:\n            count = count + 1\n    return count\n\ngrades = {\"Maya\": 88, \"Luis\": 72, \"Ari\": 95}\nprint(count_high(grades, 80))"],["h","Sample output"],["out","2"],["p","The loop unpacks each key and value, and the conditional increases the counter only for scores at or above the cutoff. The counter starts at 0 before the loop and is returned after it, which is the same running-count pattern you used with lists."],["h","Return a tuple of results"],["p","A function can return several results from one collection. The built-in functions min() and max() return the smallest and largest items, and the function below returns both of them as a tuple."],["code","def lowest_and_highest(values):\n    return min(values), max(values)\n\nlow, high = lowest_and_highest((12, 7, 19, 3))\nprint(\"Low:\", low)\nprint(\"High:\", high)"],["h","Sample output"],["out","Low: 3\nHigh: 19"],["p","The argument here is a tuple, but a list would work as well, because min() and max() can examine any sequence of comparable values. The function returns two results at once, and the caller unpacks them into low and high."],["h","A function can change a list it receives"],["p","Lists are mutable, so when a list is passed to a function, the function receives the same list rather than a separate copy. Changing it inside the function changes the caller’s list too. This is different from the numbers in Lesson 8.2, where assigning a new value affected only the parameter."],["code","def add_item(items, new_item):\n    items.append(new_item)\n\ntasks = [\"read\", \"study\"]\nadd_item(tasks, \"practice\")\nprint(tasks)\n\ndef with_item(items, new_item):\n    return items + [new_item]\n\noriginal = [\"read\", \"study\"]\nextended = with_item(original, \"practice\")\nprint(original)\nprint(extended)"],["h","Sample output"],["out","['read', 'study', 'practice']\n['read', 'study']\n['read', 'study', 'practice']"],["p","The first function updates the caller’s list in place using append(), so tasks has three items afterward. The second builds a new list with the + operator from Lesson 4.4 and leaves the original untouched. Either approach can be correct. Decide which one you want, and choose a function name that makes clear whether the function changes its argument."],["h","Common mistakes"],["ul",["Starting a running total or counter inside the loop, which resets it on every pass.","Dividing by len() without handling an empty collection.","Forgetting that a function can change a list it receives, so the caller’s list changes too.","Placing return inside a loop when it should come after the loop, so later items are never examined."]],["h","Practice"],["p","1. Write a function named count_above(values, limit) that returns how many numbers in a list are greater than limit."],["p","2. Write a function that receives a dictionary of item names and prices and returns the total price."],["p","3. Write a function that returns a new list containing only the names longer than 4 characters, leaving the original list unchanged."]]},"87":{"h":"Lesson 8.7: Advanced Functions","b":[["p","The functions in the earlier lessons accept a fixed set of parameters and carry out one small job. Real programs often need functions that accept a flexible amount of information, and several functions that work together to complete a larger process. This final lesson covers both ideas. You will write functions with required, default, and variable-length parameters, split a multi-step process into smaller functions, explore recursion, and learn how to document and test your work. These tools build directly on every chapter in this textbook."],["h","Mix required, default, and keyword parameters"],["p","A single function can combine every parameter type from earlier in this chapter. Required parameters come first, followed by parameters with defaults. When calling the function, you can supply the first values by position and name the rest. Naming the values makes a call with several settings easier to read and lets you skip the defaults you do not need to change."],["code","def order_summary(item, quantity=1, price=1.0, discount=0.0):\n    subtotal = quantity * price\n    total = subtotal - subtotal * discount\n    return item + \": \" + str(round(total, 2))\n\nprint(order_summary(\"Pen\"))\nprint(order_summary(\"Notebook\", 4, 2.5))\nprint(order_summary(\"Folder\", quantity=10, price=1.25, discount=0.2))\nprint(order_summary(\"Lamp\", price=18.0, discount=0.1))"],["h","Sample output"],["out","Pen: 1.0\nNotebook: 10.0\nFolder: 10.0\nLamp: 16.2"],["p","The first call relies on every default. The second supplies quantity and price by position. The third names all three optional values, and the fourth names price and discount while leaving quantity at its default of 1. Each call uses the same function with a different combination of arguments, and the keyword form makes the longer calls readable."],["h","Accept any number of arguments with *args"],["p","Sometimes the number of values is not known in advance, such as a function that adds any quantity of numbers. A parameter whose name begins with a single asterisk collects all the extra positional arguments into a tuple. By convention the name is often args, but a descriptive name such as numbers is clearer. Because the collected values form a tuple, you can loop over it, count it, or index it just as you learned in Chapter 5."],["code","def add_all(*numbers):\n    total = 0\n    for number in numbers:\n        total = total + number\n    return total\n\nprint(add_all(4, 8))\nprint(add_all(2, 4, 6, 8, 10))\nprint(add_all())"],["h","Sample output"],["out","12\n30\n0"],["p","The same function accepts two arguments, five arguments, or none at all. With no arguments, numbers is an empty tuple, so the loop does not run and the function returns 0. A quick way to see what the parameter holds is to print it."],["code","def show_collected(*numbers):\n    print(numbers)\n    print(type(numbers))\n\nshow_collected(3, 5, 9)"],["h","Sample output"],["out","(3, 5, 9)\n<class 'tuple'>"],["h","Accept named options with **kwargs"],["p","A parameter whose name begins with two asterisks collects any extra keyword arguments into a dictionary. The keys are the names used in the call, and the values are the arguments. By convention this parameter is often called kwargs, short for keyword arguments. It is useful when a function should accept optional details that vary from one call to the next. You can loop over the dictionary with items(), as you did in Lesson 6.6."],["code","def show_profile(name, **details):\n    print(\"Profile for\", name)\n    for key, value in details.items():\n        print(\" \", key + \":\", value)\n\nshow_profile(\"Maya\", grade=8, club=\"Chess\")\nshow_profile(\"Luis\")"],["h","Sample output"],["out","Profile for Maya\n  grade: 8\n  club: Chess\nProfile for Luis"],["p","The required parameter name receives Maya. The extra named arguments grade=8 and club=\"Chess\" are gathered into the dictionary {'grade': 8, 'club': 'Chess'}. The second call provides no extras, so details is an empty dictionary and the loop does not run."],["h","Combine the parameter forms in order"],["p","When a definition uses several kinds of parameters, they must appear in a fixed order: required parameters, then *args, then parameters with defaults, then **kwargs. A parameter that follows *args can be given only by keyword, which makes calls self-explanatory. The table summarizes each form."],["tbl",[["Form","What the function receives","Example call"],["Required parameter","One value, matched by position or name","total(10)"],["Default parameter","One value, or the default if omitted","total(10, tax=0.05)"],["*args","A tuple of extra positional values","total(10, 20, 30)"],["**kwargs","A dictionary of extra named values","total(10, note=\"gift\")"]]],["code","def summarize(title, *values, unit=\"points\", **notes):\n    print(title)\n    print(\"  Values:\", values)\n    if values:\n        print(\"  Total:\", sum(values), unit)\n    for key, value in notes.items():\n        print(\"  Note -\", key + \":\", value)\n\nsummarize(\"Quiz 1\", 8, 9, 7, unit=\"marks\", reviewer=\"Ari\")\nsummarize(\"Quiz 2\")"],["h","Sample output"],["out","Quiz 1\n  Values: (8, 9, 7)\n  Total: 24 marks\n  Note - reviewer: Ari\nQuiz 2\n  Values: ()"],["p","In the first call, 8, 9, and 7 go to values because they are extra positional arguments. The parameter unit comes after *values, so it can be set only by name, and reviewer=\"Ari\" falls through to notes. In the second call, values is empty, so the if statement skips the total. A signature this flexible should have a purpose. When a fixed list of parameters is enough, it is easier to read and to check, so use *args and **kwargs only when the flexibility is genuinely needed."],["h","Unpack collections into a call"],["p","The asterisk symbols also work in the opposite direction. Placing * before a list or tuple in a call spreads its items into separate positional arguments, and placing ** before a dictionary spreads its entries into keyword arguments. This lets a program build its data first and decide later how to call the function."],["code","def describe(name, grade, club=\"none\"):\n    return name + \", grade \" + str(grade) + \", club \" + club\n\npair = (\"Ari\", 7)\noptions = {\"name\": \"Maya\", \"grade\": 8, \"club\": \"Chess\"}\nprint(describe(*pair))\nprint(describe(**options))"],["h","Sample output"],["out","Ari, grade 7, club none\nMaya, grade 8, club Chess"],["p","The call describe(*pair) is the same as describe(\"Ari\", 7), and describe(**options) is the same as describe(name=\"Maya\", grade=8, club=\"Chess\"). The dictionary keys must match the parameter names exactly, or Python reports an unexpected keyword argument."],["h","Avoid a list as a default value"],["p","Earlier in this chapter you learned that default values should be simple. The reason appears with values that can change in place. Python creates a default value once, when the def statement runs, not each time the function is called. If that value is a list, every call that omits the argument shares the same list, so items added during one call are still there during the next."],["code","def add_task(task, tasks=[]):\n    tasks.append(task)\n    return tasks\n\nprint(add_task(\"read\"))\nprint(add_task(\"write\"))"],["h","Sample output"],["out","['read']\n['read', 'write']"],["p","The second call did not supply a list, yet its result contains read from the first call, because both calls used the same default list. The usual fix is to use None as the default and create a fresh list inside the function. The is operator, which you met in Lesson 4.4, is the standard way to test for None."],["code","def add_task(task, tasks=None):\n    if tasks is None:\n        tasks = []\n    tasks.append(task)\n    return tasks\n\nprint(add_task(\"read\"))\nprint(add_task(\"write\"))"],["h","Sample output"],["out","['read']\n['write']"],["p","Now each call that omits tasks gets its own new empty list, so the two results are independent. The same advice applies to a dictionary default: use None and create the dictionary inside the function."],["h","Break a larger process into small functions"],["p","A function that does too many things is hard to read, test, and change. A better design gives each function one job and then lets a coordinating function call the others in order. Each small function can be tested alone, and the overall process reads like an outline. In the example below, one function removes invalid scores, one builds a summary for a single student, one summarizes the whole class, and one displays a summary. The program also imports mean from the statistics module, as in Chapter 7."],["code","from statistics import mean\n\ndef clean_scores(scores, low=0, high=100):\n    valid = []\n    for score in scores:\n        if score >= low and score <= high:\n            valid.append(score)\n    return valid\n\ndef summarize_student(name, scores):\n    valid = clean_scores(scores)\n    if not valid:\n        return {\"name\": name, \"average\": None, \"count\": 0}\n    return {\"name\": name, \"average\": round(mean(valid), 1), \"count\": len(valid)}\n\ndef summarize_class(gradebook):\n    summaries = []\n    for name, scores in gradebook.items():\n        summaries.append(summarize_student(name, scores))\n    return summaries\n\ndef print_summary(summary):\n    name = summary[\"name\"]\n    average = summary[\"average\"]\n    if average is None:\n        print(name, \"- no valid scores\")\n    else:\n        print(name, \"- average\", average, \"from\", summary[\"count\"], \"scores\")\n\ngradebook = {\n    \"Maya\": [88, 92, 79],\n    \"Luis\": [72, 105, 64],\n    \"Ari\": [-5, 140],\n}\nfor summary in summarize_class(gradebook):\n    print_summary(summary)"],["h","Sample output"],["out","Maya - average 86.3 from 3 scores\nLuis - average 68 from 2 scores\nAri - no valid scores"],["p","Follow the data through the program. The loop at the bottom asks summarize_class() for a list of summaries. That function loops over the gradebook dictionary and calls summarize_student() for each name and list of scores. summarize_student() calls clean_scores() to keep only scores from 0 through 100, so Luis’s 105 is discarded and both of Ari’s scores are removed. The function then returns a small dictionary. Finally, print_summary() decides how to display each dictionary."],["p","Each function can be understood, and changed, on its own. If the valid range changes, only clean_scores() needs to be edited, and its default arguments already allow a different range to be supplied. If the report format changes, only print_summary() changes. Notice also that every summary dictionary has the same keys, so the code that uses a summary can count on its shape. When a student has no valid scores, the function returns None for the average instead of dividing by zero, and print_summary() checks for that case."],["h","Recursion: a function that calls itself"],["p","A function is allowed to call itself. This technique is called recursion. A recursive function solves a problem by handling a small piece directly and passing a smaller version of the same problem to another call. Every recursive function needs a base case, a condition in which it returns without calling itself again. Without a base case, the calls would continue until Python stops the program with a RecursionError."],["code","def countdown(number):\n    if number == 0:\n        print(\"Liftoff!\")\n    else:\n        print(number)\n        countdown(number - 1)\n\ncountdown(3)"],["h","Sample output"],["out","3\n2\n1\nLiftoff!"],["p","When number is 3, the function prints 3 and calls countdown(2). That call prints 2 and calls countdown(1), which prints 1 and calls countdown(0). The base case, number == 0, prints Liftoff! and makes no further call. Every call after the first receives a smaller number, so the base case is always reached."],["p","A recursive function can also return a value built from the value returned by the next call. The factorial of a number is the product of every whole number from 1 up to that number."],["code","def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(5))\nprint(factorial(1))"],["h","Sample output"],["out","120\n1"],["p","The factorial of 5 is 5 * 4 * 3 * 2 * 1. The function expresses that as 5 * factorial(4), and factorial(4) as 4 * factorial(3), until factorial(1) returns 1 as the base case. Python then multiplies the returned values back up the chain: 1, then 2, then 6, then 24, then 120. A loop can solve this problem too, and for simple counting tasks a loop is often clearer. Recursion is most helpful when a problem naturally contains smaller copies of itself."],["h","Document a function with a docstring"],["p","A docstring is a string placed on the first line of a function body, written with triple quotes. It states what the function does, what its parameters mean, and what it returns. Python stores the docstring with the function, and help(function_name) can display it. A comment explains one line of code; a docstring describes the whole function for the person who will call it."],["code","def percent(part, whole):\n    \"\"\"Return part as a percentage of whole, rounded to one decimal place.\n    Return None when whole is zero.\"\"\"\n    if whole == 0:\n        return None\n    return round(part / whole * 100, 1)\n\nprint(percent(18, 24))\nprint(percent(5, 0))"],["h","Sample output"],["out","75.0\nNone"],["p","The docstring tells a caller what to expect, including the special case where whole is zero. Writing it before the rest of the function can also help you decide exactly what the function should do."],["h","Test a function with chosen inputs"],["p","Testing a function means calling it with chosen inputs and comparing the results with what you expect. Choose ordinary values, boundary values, and unexpected values, as you did when tracing conditionals in Chapter 2. A small table of cases stored as tuples and processed with a loop keeps the checks together."],["code","def letter(avg):\n    if avg >= 90:\n        return \"A\"\n    elif avg >= 80:\n        return \"B\"\n    elif avg >= 70:\n        return \"C\"\n    return \"Needs work\"\n\ncases = (\n    (95, \"A\"), (90, \"A\"), (89.9, \"B\"),\n    (70, \"C\"), (69, \"Needs work\"), (0, \"Needs work\"),\n)\nfor value, expected in cases:\n    result = letter(value)\n    if result == expected:\n        print(\"pass\", value)\n    else:\n        print(\"FAIL\", value, \"expected\", expected, \"got\", result)"],["h","Sample output"],["out","pass 95\npass 90\npass 89.9\npass 70\npass 69\npass 0"],["p","Each tuple holds an input and the result it should produce. The loop unpacks the pair, calls the function, and prints pass or FAIL. The cases include values on each side of the boundaries: 90 and 89.9, 70 and 69. If the function used &gt; where &gt;= was needed, the FAIL line for 90 would reveal it immediately. Tests like these also make later changes safer, because you can run them again after every edit."],["h","Common mistakes"],["ul",["Placing a parameter with a default before a required parameter, or placing **kwargs before *args.","Treating *args as a list and calling append() on it; it is a tuple.","Writing a recursive function with no base case, or with a base case that is never reached.","Using a list or dictionary as a default value, which is shared between calls.","Writing one large function that does many jobs, which makes it hard to read and test."]],["h","Practice"],["p","1. Write a function average_of(*numbers) that returns the average of any number of arguments, or None when no arguments are supplied."],["p","2. Write a function show_settings(**options) that prints each option name and value on its own line, then call it with three named options."],["p","3. Write a recursive function sum_to(n) that returns 1 + 2 + ... + n. Identify its base case, then write a loop version and compare the two."]]},"89":{"h":"Chapter 8 Review","b":[["p","A function is a named block of code that runs when it is called. A def statement creates the function, parameters receive the information a call supplies, and return sends a value back to the caller. Default values make parameters optional, and keyword arguments let a call name the values it supplies. Variables created inside a function are local to it, so values should travel into a function through parameters and out through return. Functions can loop over collections, make decisions, and return tuples, lists, or dictionaries. Advanced functions can accept any number of positional arguments with *args and any number of named options with **kwargs, call other functions to complete a larger process, and call themselves through recursion. Docstrings and chosen test cases help you describe and check what a function does."],["h","Review the function tools"],["tbl",[["Idea","Form","Key point"],["Definition","def name(parameters):","Creates the function but does not run it."],["Call","name(arguments)","Runs the body; arguments match parameters by position or name."],["Return","return value","Ends the function and sends a value to the caller."],["Default argument","def f(x, y=1):","Optional; required parameters come first."],["Keyword argument","f(y=2, x=5)","Names the parameter; order does not matter."],["*args","def f(*items):","Collects extra positional values into a tuple."],["**kwargs","def f(**options):","Collects extra named values into a dictionary."],["Recursion","A function that calls itself","Needs a base case that stops the calls."]]],["h","Putting the ideas together"],["p","This short program combines several skills from the chapter. The function item_total() uses a default quantity and returns a number. The function cart_summary() loops over a dictionary whose values are tuples, calls item_total() for each item, and returns two results. The calling code unpacks the returned tuple."],["code","def item_total(price, quantity=1):\n    return round(price * quantity, 2)\n\ndef cart_summary(cart):\n    total = 0\n    count = 0\n    for name, details in cart.items():\n        price, quantity = details\n        total = total + item_total(price, quantity)\n        count = count + quantity\n    return total, count\n\ncart = {\"pens\": (0.75, 4), \"notebook\": (2.5, 2), \"folder\": (1.25, 1)}\ntotal, count = cart_summary(cart)\nprint(\"Items:\", count)\nprint(\"Total:\", total)"],["h","Sample output"],["out","Items: 7\nTotal: 9.25"],["p","Each function has one clear job. item_total() calculates the cost of one entry, and cart_summary() manages the loop, the running total, and the count. Because the totals travel through return, the program that calls cart_summary() decides how to display them. If the output is unexpected, test one function at a time with simple arguments before checking the whole program."],["h","Looking back at the textbook"],["p","Functions complete the set of tools in this textbook. You began by displaying values and storing them in variables, then learned to make decisions, repeat work, organize information in collections, reuse code from modules, and finally package your own code into functions. Most programs, including the ones you will write next, are built from these same pieces: input, conditions, loops, collections, modules, and functions, each doing a clear job."],["tbl",[["Chapter","What you can now do"],["1. Python Basics","Display output, store values, collect input, convert types, and calculate."],["2. Conditionals","Choose between paths with if, elif, else, comparisons, and logical operators."],["3. Loops","Repeat instructions with while and for loops and control them with break and continue."],["4. Lists","Store, read, change, and process ordered collections."],["5. Tuples","Group fixed values together, unpack them, and choose between tuples and lists."],["6. Dictionaries","Look up information by key and organize records in levels."],["7. Modules","Reuse code from the standard library and external packages."],["8. Functions","Package your own code into reusable, readable, and testable pieces."]]],["p","Keep practicing by writing small programs that combine several chapters, tracing them by hand, and testing them with ordinary, boundary, and unexpected values. When you are ready for new topics, good next steps include reading and writing text files, handling errors with try and except, and organizing related functions and data into classes."]]},"00":{"h":"Python I","b":[["p","From first output to confident decisions"],["h","Reading code examples"],["p","Code appears in shaded boxes. Text shown after a prompt such as Name: is typed by the person running the program. Sample output shows what Python displays. Python is sensitive to spelling, capitalization, quotation marks, and indentation."]]}};
